<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCF9F5">
<title>주소창 3차 — 시트를 숨기는 방식</title>
<style>
  /* 🔴 3차. 1·2차는 전부 투명이었다 — 재현 실패였다.
     그 두 시험의 시트는 둘 다 `display:none → block` 이었는데,
     앱에서 불투명해지는 창 둘(내 코드·내 메뉴)은 **늘 화면에 깔려 있고 opacity 만 0→1** 이다.
     차이가 거기 하나뿐이므로 이번엔 **숨기는 방식**만 바꿔 가며 잰다.
     ⚠️ 2차에서 하나씩 켜 보던 얼개 넷(sticky 상단바·fixed 하단바·overscroll·100svh)은
        이번엔 **처음부터 넷 다 켜 둔다**. 앱과 같은 조건에서 재는 것이 목적이다. */
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body { margin: 0; background: #FCF9F5; color: #2B120D;
         overscroll-behavior-y: none;
         font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

  .top { position: sticky; top: 0; z-index: 40;
         padding: 12px 16px; background: #FCF9F5; border-bottom: 1px solid #EFE3D6; font-weight: 800; }
  .page { min-height: 100svh; }

  .tabbar {
    display: flex; justify-content: space-around; align-items: center;
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 412px; z-index: 50;
    padding: 10px; border-radius: 24px;
    background: rgba(252,249,245,.55); border: 1px solid rgba(43,18,13,.06);
    box-shadow: 0 1px 3px rgba(43,18,13,.18), 0 3px 9px rgba(43,18,13,.22);
    -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15);
    font-size: 11px; font-weight: 700; color: #4D4139;
  }

  .wrap { padding: 14px 16px 120px; }
  h1 { margin: 6px 0 4px; font-size: 18px; }
  .lead { margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: #7A6459; }
  .lead b { color: #C0392B; }
  .now { margin: 0 0 12px; padding: 9px 12px; border-radius: 10px; background: #FFF3D6;
         font-size: 12.5px; font-weight: 700; line-height: 1.5; }
  .btns { display: grid; gap: 8px; }
  .btns button { padding: 13px 15px; border: 1px solid #E7DACE; border-radius: 12px;
                 background: #fff; font-family: inherit; text-align: left; }
  .btns button b { display: block; font-size: 15px; margin-bottom: 3px; }
  .btns button span { display: block; font-size: 12px; line-height: 1.5; color: #8A7A70; }
  .btns button.ref b { color: #7A6459; }
  .filler { margin-top: 20px; }
  .filler div { height: 64px; margin-bottom: 8px; border-radius: 12px; background: #F1E6DC; }

  /* ── 시트 ── 겉모습은 다섯 칸 모두 같다. 다른 것은 **닫혀 있는 동안의 상태** 하나다.
     앱과 같게 상단바 아래부터 덮고(top), 아래는 화면 끝까지 간다(bottom:0). */
  .sheet {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0; z-index: 60;
    background: #FCF9F5; padding: 20px;
  }
  /* A · 앱의 레시피·스토리·가챠 방식 — 닫혀 있으면 화면에서 통째로 빠진다 */
  .sheet[data-mode="none"] { display: none; }
  .sheet[data-mode="none"].on { display: block; }

  /* B · 앱의 내 코드·내 메뉴 방식 — 늘 깔려 있고 투명하기만 하다 (재현 후보) */
  .sheet[data-mode="opacity"] { display: block; opacity: 0; pointer-events: none; transition: opacity .22s; }
  .sheet[data-mode="opacity"].on { opacity: 1; pointer-events: auto; }

  /* C · B 인데 닫혀 있는 동안 visibility 로도 지운다 (고침 후보 1) */
  .sheet[data-mode="visibility"] { display: block; opacity: 0; visibility: hidden; pointer-events: none;
                                   transition: opacity .22s, visibility .22s; }
  .sheet[data-mode="visibility"].on { opacity: 1; visibility: visible; pointer-events: auto; }

  /* D · B 인데 아래를 하단바 위에서 끊는다 — 주소창 자리를 안 덮는다 (고침 후보 2) */
  .sheet[data-mode="bottomgap"] { display: block; opacity: 0; pointer-events: none; transition: opacity .22s;
                                  bottom: 90px; }
  .sheet[data-mode="bottomgap"].on { opacity: 1; pointer-events: auto; }

  .sheet h2 { margin: 8px 0 6px; font-size: 17px; }
  .sheet p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: #7A6459; }
  .sheet button { padding: 12px 18px; border: none; border-radius: 10px;
                  background: #E0301E; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>

<div class="top">주소창 3차 시험</div>

<div class="page">
  <div class="wrap">
    <h1>시트를 <b>어떻게 숨기느냐</b>만 바꿔 봅니다</h1>
    <p class="lead">
      1·2차는 전부 투명이었습니다 — 그 시험의 시트는 <b>닫히면 화면에서 빠지는</b> 방식이었기 때문입니다.<br>
      앱에서 불투명해지는 창 둘(내 코드·내 메뉴)은 <b>닫혀 있어도 화면을 덮은 채 투명하기만</b> 합니다.<br>
      이번엔 얼개 넷(붙박이 상단바·떠 있는 하단바·overscroll·100svh)을 <b>처음부터 넷 다 켜 뒀습니다.</b><br>
      번호마다 <b>새로고침</b> → 누르기 → 닫기 → <b>주소창</b> 보기.
    </p>
    <p class="now" id="now">아직 안 눌렀습니다</p>
    <div class="btns" id="btns"></div>
    <div class="filler" id="filler"></div>
  </div>
</div>

<div class="tabbar"><span>홈</span><span>레시피</span><span>메뉴</span><span>매장</span><span>스티커</span></div>

<div class="sheet" id="sheet" data-mode="none">
  <h2 id="sheetTitle">시트</h2>
  <p id="sheetDesc"></p>
  <button type="button" id="sheetClose">닫기</button>
</div>

<script>
var 칸 = [
  { 이름: '1 · 닫히면 화면에서 뺀다 (대조군)', 모드: 'none',
    참고: true,
    설명: '앱의 레시피·스토리·가챠 방식. 1·2차 시험도 이것이었다. 여기서 불투명해지면 앞 시험이 잘못된 것이다.' },
  { 이름: '2 · 늘 깔아두고 투명하게만 (재현 후보)', 모드: 'opacity',
    설명: '앱의 내 코드·내 메뉴 방식. 닫혀 있어도 화면 전체를 덮고 있다. ★여기서 불투명해지면 범인이 잡힌 것이다.' },
  { 이름: '3 · 2번 + visibility 로도 지움', 모드: 'visibility',
    설명: '고침 후보 1. 2번에서 재현됐다면, 이것으로 투명하게 돌아오는지 본다.' },
  { 이름: '4 · 2번 + 아래를 하단바 위에서 끊음', 모드: 'bottomgap',
    설명: '고침 후보 2. 시트가 주소창 자리를 안 덮게 한다. 2번에서 재현됐을 때만 의미가 있다.' }
];

var sheet = document.getElementById('sheet');
document.getElementById('btns').innerHTML = 칸.map(function (m, i) {
  return '<button type="button" class="' + (m.참고 ? 'ref' : '') + '" data-i="' + i + '">'
       + '<b>' + m.이름 + '</b><span>' + m.설명 + '</span></button>';
}).join('');

document.getElementById('btns').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var m = 칸[+b.dataset.i];
  sheet.dataset.mode = m.모드;
  document.getElementById('now').textContent = '지금 켠 것: ' + m.이름;
  document.getElementById('sheetTitle').textContent = m.이름;
  document.getElementById('sheetDesc').textContent = m.설명 + '  ▸ 닫은 뒤 주소창을 봐 주세요.';
  document.documentElement.style.overflow = 'hidden';   // 앱과 같은 잠금
  sheet.classList.add('on');
});

document.getElementById('sheetClose').addEventListener('click', function () {
  sheet.classList.remove('on');
  document.documentElement.style.overflow = '';          // 앱과 같은 풀기
});

var f = document.getElementById('filler'), h = '';
for (var i = 0; i < 30; i++) h += '<div></div>';
f.innerHTML = h;
</script>
</body>
</html>
