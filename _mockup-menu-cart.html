<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>담기 표시 3안 비교 — 하딜고고</title>
<!-- 🔴 고르기용 비교판이다. `_mockup-menu.html`(본 목업)과 앱 파일은 한 줄도 안 건드렸다.
     본 목업의 <style>을 실행할 때 그대로 읽어다 쓴다 — 값을 베껴 적으면 본 목업이 바뀔 때 따로 논다. -->
<link rel="stylesheet" href="styles.css?v=635">
<style>
body { background: var(--bg-card); }
.main { padding-bottom: 40px; }
.topbar-inner { display:flex; align-items:center; justify-content:space-between; }
.mk-sec-title { font-size:15px; font-weight:700; color:var(--text-dark); }

/* ── 고르는 곳 ─────────────────────────────────────────── */
.cmp {
  max-width:440px; margin:0 auto; padding:14px 20px 0;
}
.cmp-q { font-size:13px; font-weight:700; color:var(--text-dark); margin:0 0 8px; }
.cmp-seg { display:flex; gap:6px; }
.cmp-seg button {
  flex:1; padding:9px 0; border:1px solid #E4D8C6; border-radius:10px;
  background:#fff; font-family:inherit; font-size:13px; font-weight:700;
  color:var(--text-muted); cursor:pointer;
}
.cmp-seg button.is-on { border-color:var(--brand-red); color:var(--brand-red); background:#FFF6F4; }
.cmp-desc {
  margin:10px 0 0; padding:10px 12px; border-radius:10px; background:#FBF4E6;
  font-size:12.5px; line-height:1.55; color:var(--text-dark);
}
.cmp-desc b { color:var(--brand-red); }
.cmp-sum {
  max-width:440px; margin:12px auto 0; padding:0 20px;
  font-size:12px; color:var(--text-muted);
}

/* ── 안 ②: 수량 스테퍼 ────────────────────────────────── */
/* 🔴 글자 카드(.mn-card--text)는 본 목업에서 가로 flex다. 그대로 두면 스테퍼가 이름 **옆**에
   붙어 이름 자리가 좁아진다(제주 흑돼지목살이 실제로 두 줄이 됐다). ②에서만 세로로 쌓는다. */
.mn-card--text.cmp-col { flex-direction:column; }
.qty {
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 8px; border-top:1px solid #F0E6D8;
}
.qty button {
  width:26px; height:26px; border:1px solid #E4D8C6; border-radius:7px;
  background:#fff; font-family:inherit; font-size:14px; font-weight:700;
  color:var(--text-dark); line-height:1; cursor:pointer;
}
.qty span { font-size:13px; font-weight:700; color:var(--text-dark); }
.qty-add {
  display:block; width:100%; padding:7px 0; border:0; border-top:1px solid #F0E6D8;
  background:none; font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--text-muted); cursor:pointer;
}

/* ── 안 ③: 숫자 배지 (전골 냄비 번호와 같은 모양) ─────── */
.cnt {
  position:absolute; top:6px; right:6px; z-index:2;
  min-width:23px; height:23px; padding:0 6px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.55); color:#fff;
  font-size:13px; font-weight:700; line-height:1;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="topbar-brand" type="button">
      <img class="topbar-logo-mark" src="assets/icons/logo-mark-color-v2.png?v=1" width="25" height="22" alt="">
      <span class="topbar-title">하딜고고</span>
    </button>
    <span class="mk-sec-title">담기 표시 비교</span>
  </div>
</header>

<main class="main">
  <div class="cmp">
    <p class="cmp-q">카드를 눌러 담을 때, 담긴 걸 어떻게 보여줄까요?</p>
    <div class="cmp-seg" id="cmpSeg">
      <button data-mode="1" class="is-on">① 확인 표시</button>
      <button data-mode="2">② 수량</button>
      <button data-mode="3">③ 숫자 배지</button>
    </div>
    <p class="cmp-desc" id="cmpDesc"></p>
  </div>

  <p class="cmp-sum" id="cmpSum"></p>

  <div class="mn-bar" style="margin-top:12px">
    <button class="mn-basket" id="basketBar" type="button">
      <span class="mn-basket-txt is-empty" id="basketTxt">담은 목록</span>
      <span class="mn-basket-arrow">›</span>
    </button>
    <div class="mn-tabs" id="mnTabs"></div>
  </div>

  <div id="mnBody"></div>
</main>

<script src="_mockup-menu-data.js"></script>
<script>
(function () {
  // ── 본 목업의 <style>을 통째로 빌려온다 ────────────────────────
  // 🔴 카드·탭·배지 모양을 여기에 베껴 적지 않는다. 본 목업이 바뀌면 이 화면도 같이 바뀌어야
  //    비교가 의미가 있다. 그래서 파일을 읽어 <style>만 뽑아 붙인다.
  fetch('_mockup-menu.html')
    .then(r => r.text())
    .then(html => {
      const css = html.match(/<style>([\s\S]*?)<\/style>/);
      if (!css) { document.getElementById('cmpSum').textContent = '본 목업의 스타일을 못 읽었다'; return; }
      const tag = document.createElement('style');
      tag.textContent = css[1];
      // 이 파일의 <style>보다 먼저 오게 넣는다 — 여기 적은 것이 덮어쓸 수 있게
      document.head.insertBefore(tag, document.head.querySelector('style'));
      start();
    });

  const D = window.MENU_DATA;
  const TABS = D.tabs;                       // 전골은 이미 정해졌으니 여기선 뺀다
  const IMG = n => 'assets/menu/' + n + '.webp';

  let mode = 1;
  let cur = 0;
  const qty = new Map();                     // 이름 → 개수

  const $ = s => document.querySelector(s);
  const total = () => [...qty.values()].reduce((a, b) => a + b, 0);

  const DESC = {
    1: '담긴 카드에 <b>✓ 와 빨간 테두리</b>가 붙는다. 한 메뉴는 <b>한 번만</b> 담긴다. ' +
       '지금 목업이 이렇게 돼 있다.<br>⚠️ 전골에서 <b>육수 카드에는 이 표시를 안 붙이기로</b> 했다 — ' +
       '「이미 골라서 또 못 담는다」로 읽혔기 때문이다.',
    2: '담으면 카드 아래에 <b>− 1 +</b>가 나타난다. 같은 메뉴를 <b>여러 개</b> 담을 수 있고 ' +
       '카드에서 바로 뺀다.<br>⚠️ 카드마다 높이가 늘어나 한 화면에 보이는 카드가 줄어든다.',
    3: '누를 때마다 <b>숫자 배지</b>가 오른다(전골 냄비 번호와 같은 모양). 여러 개 담긴다. ' +
       '<b>빼기는 담은 목록의 ✕</b>로 한다.<br>⚠️ 카드 위에서 뺄 수 없어 잘못 누르면 목록을 열어야 한다.',
  };

  function renderTabs() {
    $('#mnTabs').innerHTML = TABS.map((t, i) =>
      `<button class="mn-tab ${i === cur ? 'is-on' : ''}" data-i="${i}">${t.name}</button>`).join('');
  }

  function card(it) {
    const n = qty.get(it.n) || 0;
    const on = mode === 1 && n > 0;
    const part = it.part ? `<span class="mn-card-part">${it.jeju ? '제주 한정' : '일부 매장'}</span>` : '';
    const thumb = `<div class="mn-card-thumb ${it.img ? '' : 'is-text'} ${!it.img && it.part ? 'has-part' : ''}">` +
                  `${it.img ? `<img src="${IMG(it.n)}" alt="">` : it.n}</div>`;
    const name = it.img ? `<span class="mn-card-name">${it.n}</span>` : '';

    // ① 확인 표시 — 지금 목업과 같다
    if (mode === 1) {
      return `<button class="mn-card ${on ? 'is-on' : ''} ${it.img ? '' : 'mn-card--text'}" data-menu="${it.n}">
        <span class="mn-card-check">✓</span>${part}${thumb}${name}</button>`;
    }
    // ② 수량 — 담으면 스테퍼가 생긴다
    if (mode === 2) {
      const step = n > 0
        ? `<div class="qty"><button data-minus="${it.n}">−</button><span>${n}</span><button data-plus="${it.n}">+</button></div>`
        : `<button class="qty-add" data-plus="${it.n}">담기</button>`;
      // 스테퍼가 카드 안에 들어가므로 카드는 button이 아니라 div다(버튼 안에 버튼을 못 넣는다)
      return `<div class="mn-card ${it.img ? '' : 'mn-card--text cmp-col'}">${part}${thumb}${name}${step}</div>`;
    }
    // ③ 숫자 배지 — 누른 만큼 숫자가 오른다
    return `<button class="mn-card ${it.img ? '' : 'mn-card--text'}" data-menu="${it.n}">
      ${n > 0 ? `<span class="cnt">${n}</span>` : ''}${part}${thumb}${name}</button>`;
  }

  function render() {
    renderTabs();
    $('#cmpDesc').innerHTML = DESC[mode];
    $('#mnBody').innerHTML = `<div class="mn-grid">${TABS[cur].items.map(card).join('')}</div>`;
    const t = total();
    $('#basketTxt').classList.toggle('is-empty', !t);
    $('#basketTxt').textContent = t ? `담은 목록 ${t}` : '담은 목록';
    $('#cmpSum').textContent = t
      ? `담긴 것 ${qty.size}가지 · 모두 ${t}개 — ` + [...qty].map(([k, v]) => v > 1 ? `${k}×${v}` : k).join(' · ')
      : '카드를 눌러보세요. 안을 바꿔도 담은 것은 그대로 남습니다.';
  }

  function bump(name, d) {
    const n = (qty.get(name) || 0) + d;
    if (n <= 0) qty.delete(name); else qty.set(name, n);
    render();
  }

  function start() {
    document.addEventListener('click', e => {
      const seg = e.target.closest('[data-mode]');
      if (seg) {
        mode = +seg.dataset.mode;
        [...document.querySelectorAll('#cmpSeg button')]
          .forEach(b => b.classList.toggle('is-on', b === seg));
        return render();
      }
      const tab = e.target.closest('.mn-tab');
      if (tab) { cur = +tab.dataset.i; return render(); }

      const plus = e.target.closest('[data-plus]');
      if (plus) return bump(plus.dataset.plus, 1);
      const minus = e.target.closest('[data-minus]');
      if (minus) return bump(minus.dataset.minus, -1);

      const c = e.target.closest('[data-menu]');
      if (c) {
        // ①은 켜고 끄기 · ③은 누를 때마다 하나씩 는다
        if (mode === 1) return bump(c.dataset.menu, qty.get(c.dataset.menu) ? -1 : 1);
        return bump(c.dataset.menu, 1);
      }
    });
    render();
  }
})();
</script>
</body>
</html>
