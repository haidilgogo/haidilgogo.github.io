<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냄비가 찼을 때 — 하딜고고</title>
<!-- 🔴 앱의 진짜 styles.css 를 불러다 쓴다(목업 규칙) — 토스트·모달 생김새가 실제와 같다.
     값을 베껴 적지 말 것. -->
<link rel="stylesheet" href="styles.css?v=686">
<style>
  body { margin:0; background:var(--bg-page, #FCF9F5); }
  .wrap { max-width:440px; margin:0 auto; padding:22px 20px 120px; }
  h1 { font-size:19px; font-weight:800; color:var(--text-dark); margin:6px 0 6px; }
  .lead { font-size:13.5px; color:var(--text-muted); line-height:1.65; margin:0 0 20px; }
  .lead b { color:var(--brand-red); }

  .pick { display:block; width:100%; text-align:left; margin:0 0 12px; padding:14px 16px;
          background:#fff; border:1px solid var(--card-border); border-radius:12px;
          font-family:inherit; cursor:pointer; }
  .pick-name { display:block; font-size:15px; font-weight:800; color:var(--text-dark); }
  .pick-desc { display:block; margin-top:4px; font-size:12.5px; color:var(--text-muted); line-height:1.55; }
  .pick:active { transform:scale(.985); border-color:var(--card-hover-border); }
  .tip { margin:22px 0 0; padding:12px 14px; background:#F3EDE4; border-radius:10px;
         font-size:12.5px; color:var(--text-muted); line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>냄비가 다 찼는데 또 누르면</h1>
  <p class="lead">
    아래 넷을 <b>눌러 보시고</b> 고르시면 됩니다. 앱은 아직 <b>①번(아무 반응 없음)</b> 상태입니다.
  </p>

  <button class="pick" type="button" onclick="alert('①번은 이렇게 아무 일도 일어나지 않습니다.\n(이 알림은 설명용이고, 실제로는 이것도 안 뜹니다)')">
    <span class="pick-name">① 그대로 둔다</span>
    <span class="pick-desc">눌러도 아무 일이 없습니다. 지금 앱이 이 상태입니다.</span>
  </button>

  <button class="pick" type="button" onclick="toast('냄비가 찼어요')">
    <span class="pick-name">② 토스트 · 짧게</span>
    <span class="pick-desc">화면 아래에 검은 알약이 2초 떴다가 저절로 사라집니다. 닫을 필요가 없습니다.</span>
  </button>

  <button class="pick" type="button" onclick="toast('냄비가 찼어요 · 칸을 늘리거나 빼고 담아 주세요')">
    <span class="pick-name">③ 토스트 · 길게</span>
    <span class="pick-desc">같은 알약인데 다음에 무엇을 해야 하는지까지 알려 줍니다.</span>
  </button>

  <button class="pick" type="button" onclick="openZoom()">
    <span class="pick-name">④ 확대 모달</span>
    <span class="pick-desc">화면이 어두워지고 큰 창이 뜹니다. X 를 눌러 닫아야 합니다. 이미 있는 화면입니다 —
    지금도 육수 카드의 <b>그림</b>을 누르면 이게 뜹니다.</span>
  </button>

  <p class="tip">
    ④로 하면 카드 아무 데나 눌러도 이 창이 뜹니다. 그러면 지금의
    「그림을 누르면 확대 · 나머지를 누르면 담기」 규칙이 바뀝니다.
  </p>
</div>

<div class="share-toast" id="toastEl"></div>

<script>
  var timer = null;
  function toast(text) {
    var t = document.getElementById('toastEl');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }
  function openZoom() {
    var dim = document.createElement('div');
    dim.className = 'mn-zoom-dim';
    dim.innerHTML =
      '<div class="mn-zoom">' +
        '<button class="stamp-sheet-close" type="button" aria-label="닫기">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-linecap="round">' +
          '<g transform="translate(12 12) scale(1.667) translate(-12 -12)"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.02"/></g></svg>' +
        '</button>' +
        '<div class="mn-zoom-body">' +
          '<img class="mn-zoom-img" src="assets/menu/쏸차이훠궈.webp" alt="">' +
          '<span class="mn-zoom-name">쏸차이훠궈</span>' +
          '<button class="mn-zoom-add" type="button" disabled>냄비가 찼어요</button>' +
        '</div>' +
      '</div>';
    dim.addEventListener('click', function (e) {
      if (e.target === dim || e.target.closest('.stamp-sheet-close')) dim.remove();
    });
    document.body.appendChild(dim);
  }
</script>
</body>
</html>
