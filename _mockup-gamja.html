<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>감자 빼꼼 — 자리 잡기 목업</title>
<link rel="stylesheet" href="styles.css?v=741">
<style>
/* ── 이 페이지는 '그림체'가 아니라 '자리'를 정하려고 만든 목업이다 ──
   감자 사진은 크기·위치를 재기 위한 임시 대역이다. 확정된 화풍이 아니다.
   여기서 정한 px 값이 그대로 코덱스 의뢰서에 들어간다. */
body { background: var(--bg-card); margin: 0; }
.wrap { max-width: 440px; margin: 0 auto; }

/* 미리보기 — 스티커 탭 빈 화면과 같은 조건 */
.preview {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg-card);
  border-bottom: 1px solid var(--card-border);
  overflow: hidden;
}
.empty {
  display: flex; align-items: center; justify-content: center;
  min-height: 52svh;                 /* 실제 .stamp-empty 와 같은 값 */
  padding: 40px 20px;
}
.slotwrap { position: relative; }

/* 점선 도형 = 기록 시트의 .stamp-slot / .stamp-slot-empty 와 같은 값 */
.slot { position: relative; }
.dash {
  position: absolute; inset: -12px;
  border: 2.5px dashed #D6C6BA;
  border-radius: 18px;
  background: var(--bg-card);        /* 불투명 = 감자를 실제로 가린다 */
  z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 0 10px; text-align: center;
}
.dash.semi { background: rgba(255,255,255,.5); }
.dash-ico { width: 42px; height: 42px; color: var(--text-muted); flex: none; }
.dash-txt { font-size: 13px; color: var(--text-muted); line-height: 1.6; word-break: keep-all; }
.dash.no-copy .dash-ico, .dash.no-copy .dash-txt { display: none; }

.under {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(100% + 26px); width: 260px;
  font-size: 14px; line-height: 1.7; color: var(--text-muted); text-align: center;
}

/* 감자 — 도형 뒤(z-index 1) */
.gamja { position: absolute; z-index: 1; display: block; pointer-events: none; }
.gamja.sil { filter: brightness(0) opacity(.32); }

/* 조작판 */
.panel { padding: 14px 16px 60px; }
.row { margin: 0 0 14px; }
.row > label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
.row .val { color: var(--brand-red); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--brand-red); height: 32px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 auto; min-width: 62px; padding: 10px 8px;
  border: 1px solid var(--card-border); border-radius: 10px;
  background: #fff; color: var(--text-dark);
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-pressed=true] { background: var(--brand-red); border-color: var(--brand-red); color: #fff; }
.readout {
  margin-top: 18px; padding: 14px; border-radius: 12px;
  background: #fff; border: 1px solid var(--card-border);
  font-size: 13px; line-height: 1.9; color: var(--text-dark);
  font-variant-numeric: tabular-nums; word-break: keep-all;
}
.readout b { color: var(--brand-red); }
.note { font-size: 12px; color: var(--text-muted); line-height: 1.7; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="preview">
    <div class="empty">
      <div class="slotwrap" id="slotwrap">
        <img class="gamja sil" id="gamja" src="_gamja-a.png" alt="">
        <div class="slot" id="slot">
          <div class="dash" id="dash">
            <!-- 기록 시트의 자리표시 아이콘과 같은 그림 -->
            <svg class="dash-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"
                 stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12C2 17.5228 6.47715 22 12 22C12.6477 22 13.2503 21.7004 13.7083 21.2424L21.2424 13.7083C21.7004 13.2503 22 12.6477 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12Z"/>
              <path d="M8.9126 15.9336C9.94668 16.1928 11.0951 16.2391 12.2688 16.0337"/>
              <ellipse cx="14.5094" cy="9.77405" rx="1" ry="1.5" transform="rotate(-15 14.5094 9.77405)" fill="currentColor" stroke="none"/>
              <ellipse cx="8.71402" cy="11.3278" rx="1" ry="1.5" transform="rotate(-15 8.71402 11.3278)" fill="currentColor" stroke="none"/>
              <path d="M12 22C12 19.2071 12 17.8107 12.3928 16.688C13.0964 14.6773 14.6773 13.0964 16.688 12.3928C17.8107 12 19.2071 12 22 12"/>
            </svg>
            <span class="dash-txt" id="dashTxt">여기에 첫 스티커가 붙어요</span>
          </div>
          <p class="under" id="under" hidden>아직 스티커가 없어요<br>기록하기로 첫 방문을 남겨보세요</p>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">

    <div class="row">
      <label>1. 감자 자세</label>
      <div class="seg" data-group="pose">
        <button data-v="a" aria-pressed="true">A 정면</button>
        <button data-v="b" aria-pressed="false">B 올려다봄</button>
        <button data-v="c" aria-pressed="false">C 고개돌림</button>
      </div>
    </div>

    <div class="row">
      <label>2. 어디서 빼꼼</label>
      <div class="seg" data-group="side">
        <button data-v="top" aria-pressed="true">위쪽 뒤</button>
        <button data-v="left" aria-pressed="false">왼쪽 뒤</button>
        <button data-v="right" aria-pressed="false">오른쪽 뒤</button>
      </div>
    </div>

    <div class="row">
      <label>3. 점선 도형 폭 <span class="val" id="vBox">130</span>px
        <span style="font-weight:400;color:var(--text-muted)"> · 높이 <span id="vBoxH">224</span> · 점선까지 <span id="vBoxOut">154×248</span></span></label>
      <input type="range" id="box" min="90" max="190" step="2" value="130">
    </div>

    <div class="row">
      <label>4. 감자 크기(전체 높이) <span class="val" id="vSize">180</span>px</label>
      <input type="range" id="size" min="80" max="340" step="4" value="180">
    </div>

    <div class="row">
      <label>5. 얼마나 빼꼼(도형 밖으로 나온 길이) <span class="val" id="vPeek">54</span>px</label>
      <input type="range" id="peek" min="0" max="170" step="2" value="54">
    </div>

    <div class="row">
      <label>6. 미세조정 <span class="val" id="vNudge">0</span>px
        <span style="font-weight:400;color:var(--text-muted)" id="nudgeAxis">(좌우)</span></label>
      <input type="range" id="nudge" min="-90" max="90" step="2" value="0">
    </div>

    <div class="row">
      <label>7. 도형 안 문구</label>
      <div class="seg" data-group="copy">
        <button data-v="in" aria-pressed="true">도형 안</button>
        <button data-v="under" aria-pressed="false">도형 아래</button>
        <button data-v="none" aria-pressed="false">없음</button>
      </div>
    </div>

    <div class="row">
      <label>8. 보기 방식</label>
      <div class="seg" data-group="look">
        <button data-v="sil" aria-pressed="true">실루엣</button>
        <button data-v="photo" aria-pressed="false">사진</button>
      </div>
    </div>

    <div class="row">
      <label>9. 도형 채움</label>
      <div class="seg" data-group="fill">
        <button data-v="solid" aria-pressed="true">불투명</button>
        <button data-v="semi" aria-pressed="false">반투명</button>
      </div>
    </div>

    <div class="readout" id="readout"></div>
    <p class="note">🔴 감자 사진은 <b>자리를 재기 위한 대역</b>입니다. 그림체는 여기서 정하지 않습니다.
      마음에 드는 상태가 나오면 <b>아래 요약 줄</b>을 그대로 알려주시면 됩니다.</p>
  </div>

</div>

<script>
(function () {
  const RATIO = 0.58;                 /* 점선 도형 = 스티커와 같은 세로비 */
  const DASH_OUT = 12;                /* 점선은 도형 바깥 12px */
  const PAD_TOP = 5 / 208;            /* 감자 PNG 위쪽 투명 여백 비율 — 빼꼼 값 보정 */
  const PAD_SIDE = 17 / 192;          /* 왼쪽(머리 쪽) 투명 여백 비율 */

  const el = {
    slot: document.getElementById('slot'),
    dash: document.getElementById('dash'),
    under: document.getElementById('under'),
    gamja: document.getElementById('gamja'),
    readout: document.getElementById('readout'),
    nudgeAxis: document.getElementById('nudgeAxis'),
  };
  const state = { pose: 'a', side: 'top', copy: 'in', look: 'sil', fill: 'solid' };
  const num = { box: 130, size: 180, peek: 54, nudge: 0 };

  function draw() {
    const bw = num.box, bh = Math.round(bw / RATIO);
    el.slot.style.width = bw + 'px';
    el.slot.style.height = bh + 'px';

    /* 감자 — 원본 192×208 비율 유지, 높이 기준 */
    const gh = num.size, gw = Math.round(gh * 192 / 208);
    const g = el.gamja.style;
    g.height = gh + 'px'; g.width = gw + 'px';
    g.top = g.left = g.right = g.bottom = 'auto';
    g.transform = 'none';

    if (state.side === 'top') {
      /* 도형 위 가장자리(=점선 바깥선) 위로 num.peek 만큼 털이 보이게.
         PNG 위쪽 투명 여백만큼 더 올려 '보이는 길이'와 값을 일치시킨다. */
      g.top = (-DASH_OUT - num.peek - gh * PAD_TOP) + 'px';
      g.left = '50%';
      g.transform = 'translateX(-50%) translateX(' + num.nudge + 'px)';
    } else if (state.side === 'left') {
      /* 왼쪽 뒤 — 감자 머리가 프레임 왼쪽에 있으므로 그대로 둔다 */
      g.left = (-num.peek - gw * PAD_SIDE) + 'px';
      g.top = '50%';
      g.transform = 'translateY(-50%) translateY(' + num.nudge + 'px)';
    } else {
      /* 오른쪽 뒤 — 좌우를 뒤집어야 머리가 도형 밖으로 나온다 */
      g.right = (-num.peek - gw * PAD_SIDE) + 'px';
      g.top = '50%';
      g.transform = 'translateY(-50%) translateY(' + num.nudge + 'px) scaleX(-1)';
    }

    el.gamja.src = '_gamja-' + state.pose + '.png';
    el.gamja.classList.toggle('sil', state.look === 'sil');
    el.dash.classList.toggle('semi', state.fill === 'semi');
    el.dash.classList.toggle('no-copy', state.copy !== 'in');
    el.under.hidden = state.copy !== 'under';
    el.nudgeAxis.textContent = state.side === 'top' ? '(좌우)' : '(상하)';

    document.getElementById('vBox').textContent = bw;
    document.getElementById('vBoxH').textContent = bh;
    document.getElementById('vBoxOut').textContent = (bw + 24) + '×' + (bh + 24);
    document.getElementById('vSize').textContent = gh;
    document.getElementById('vPeek').textContent = num.peek;
    document.getElementById('vNudge').textContent = num.nudge;

    const 방향 = { top: '위쪽 뒤', left: '왼쪽 뒤', right: '오른쪽 뒤' }[state.side];
    const 자세 = { a: 'A 정면', b: 'B 올려다봄', c: 'C 고개돌림' }[state.pose];
    const 문구 = { in: '도형 안', under: '도형 아래', none: '없음' }[state.copy];
    el.readout.innerHTML =
      '자세 <b>' + 자세 + '</b> · 방향 <b>' + 방향 + '</b><br>' +
      '도형 <b>' + bw + '×' + bh + '</b> (점선까지 ' + (bw + 24) + '×' + (bh + 24) + ')<br>' +
      '감자 높이 <b>' + gh + '</b> · 빼꼼 <b>' + num.peek + '</b> · 미세조정 <b>' + num.nudge + '</b><br>' +
      '문구 <b>' + 문구 + '</b> · 채움 <b>' + (state.fill === 'solid' ? '불투명' : '반투명') + '</b>';
  }

  document.querySelectorAll('.seg').forEach(function (seg) {
    seg.addEventListener('click', function (e) {
      const b = e.target.closest('button'); if (!b) return;
      state[seg.dataset.group] = b.dataset.v;
      seg.querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      draw();
    });
  });
  ['box', 'size', 'peek', 'nudge'].forEach(function (k) {
    document.getElementById(k).addEventListener('input', function (e) {
      num[k] = Number(e.target.value); draw();
    });
  });
  draw();
})();
</script>
</body>
</html>
