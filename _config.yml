# GitHub Pages(Jekyll) 빌드 설정 — 웹에 내보내지 않을 파일 목록.
#
# 🔴 왜 필요한가: 이 저장소는 루트가 그대로 웹으로 서빙된다. 그래서 내부 문서인
#    CLAUDE.md·HANDOVER.md가 https://haidilgogo.com/HANDOVER.md 로 누구나 열람 가능했다
#    (2026-07-30 발견, 각각 18KB·61KB가 HTTP 200으로 응답했다).
#    비밀번호·키는 없지만 미공개 계획·판단 근거·좋아요 숫자가 더미라는 사실까지 들어 있다.
#
# 🔴 robots.txt로는 못 막는다. 그건 크롤러에게 "색인하지 말라"고 부탁하는 것뿐이고
#    주소를 아는 사람은 그대로 읽을 수 있다. exclude로 파일 자체를 안 내보내야 404가 된다.
#
# 🔴 2026-08-01 — exclude만으로는 부족했다. 저장소가 공개(PUBLIC)라서 사이트에서는 404여도
#    raw.githubusercontent.com 주소로는 그대로 읽혔다(200 확인). exclude는 "사이트로 내보내지
#    않는다"일 뿐 "저장소에서 감춘다"가 아니다.
#    → 내부 문서는 비공개 저장소 haidilgogo/haidilgogo-docs 로 옮겼고 여기선 .gitignore로 막는다.
#    아래 목록은 이제 저장소에 없는 파일들이지만, 실수로 다시 커밋됐을 때의 2차 방어선으로 남겨둔다.
#
# ⚠️ exclude는 Jekyll 기본값을 덮어쓴다. 이 저장소엔 Gemfile·node_modules 등이 없어 문제없다.
# ⚠️ 새 내부 문서는 저장소 루트에 만들지 말 것(공개된다). 비공개 문서 저장소에 만든다.
#    점(.)으로 시작하는 파일·폴더(.claude 등)는 Jekyll이 기본으로 제외하므로 적지 않아도 된다.
# 🔴 시험·목업 파일도 안 내보낸다(2026-08-07 신설).
#    실제로 `_tmp-g1.html`·`_mockup-gamja*.html` 같은 것이 커밋되어 웹에 올라가 있었다.
#    앱은 하나도 안 쓰는데 주소만 알면 누구나 열 수 있었다.
#    ⚠️ 이름 규칙이다 — 앞으로 만드는 시험 파일도 `_tmp-` / `_mockup-` 으로 시작하면 자동으로 막힌다.
exclude:
  - "_tmp-*"
  - "_mockup-*"
  - "_before-*"
  - CLAUDE.md
  - HANDOVER.md
  - REVIEW-SYNC-CODE.md
  - REVIEW-SYNC-CODE-2.md
  - REVIEW-SYNC-CODE-3.md
  - REVIEW-SYNC-CODE-4.md
  - REVIEW-SYNC-CODE-5.md
  - REVIEW-SYNC-CODE-5-REPLY.md
  - REVIEW-SYNC-CODE-6.md
  - REVIEW-SYNC-CODE-6-REPLY.md
  - REVIEW-SYNC-CODE-7.md
  - REVIEW-SYNC-CODE-7-REPLY.md
