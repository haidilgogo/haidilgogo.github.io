# GitHub Pages(Jekyll) 빌드 설정 — 웹에 내보내지 않을 파일 목록.
#
# 🔴 왜 필요한가: 이 저장소는 루트가 그대로 웹으로 서빙된다. 루트에 둔 파일은
#    https://haidilgogo.com/ 바로 아래 주소로 누구나 열 수 있다.
#
# 🔴 robots.txt로는 못 막는다. 그건 크롤러에게 "색인하지 말라"고 부탁하는 것뿐이고
#    주소를 아는 사람은 그대로 읽을 수 있다. exclude로 파일 자체를 안 내보내야 404가 된다.
#
# 🔴 exclude만으로는 부족하다. 저장소가 공개(PUBLIC)라서 사이트에서는 404여도
#    raw.githubusercontent.com 주소로는 그대로 읽힌다. exclude는 "사이트로 내보내지
#    않는다"일 뿐 "저장소에서 감춘다"가 아니다.
#    → 내부 문서는 이 저장소에 두지 않고 .gitignore로 막는다.
#    아래 목록은 저장소에 없는 파일들이지만, 커밋되는 경우에 대비한 2차 방어선으로 남겨둔다.
#
# ⚠️ exclude는 Jekyll 기본값을 덮어쓴다. 이 저장소엔 Gemfile·node_modules 등이 없어 문제없다.
# ⚠️ 새 내부 문서는 저장소 루트에 만들지 말 것(공개된다).
#    점(.)으로 시작하는 파일·폴더는 Jekyll이 기본으로 제외하므로 적지 않아도 된다.
# 🔴 작업용 파일도 안 내보낸다 — 앱이 쓰지 않는 파일이 주소만 알면 누구나 열 수 있게 되기 때문이다.
#    ⚠️ 이름 규칙이다 — 작업 파일은 `_tmp-` / `_mockup-` 으로 시작하면 자동으로 막힌다.
exclude:
  - "_tmp-*"
  - "_mockup-*"
  - "_before-*"
  - CLAUDE.md
  - HANDOVER.md
  - REVIEW-SYNC-CODE.md
  - REVIEW-SYNC-CODE-2.md
  - REVIEW-SYNC-CODE-3.md
  - REVIEW-SYNC-CODE-4.md
  - REVIEW-SYNC-CODE-5.md
  - REVIEW-SYNC-CODE-5-REPLY.md
  - REVIEW-SYNC-CODE-6.md
  - REVIEW-SYNC-CODE-6-REPLY.md
  - REVIEW-SYNC-CODE-7.md
  - REVIEW-SYNC-CODE-7-REPLY.md

# 🔴 제킬(GitHub Pages)은 이름이 `_` 로 시작하는 파일·폴더를 내보내지 않는다.
#    로컬 서버에는 이 규칙이 없어 로컬 검사로는 못 잡고, 라이브에서만 404가 난다.
#    `include:` 로 그 파일을 지정해도 배포 빌드에서 안 나온다 — 파일 이름에서 `_` 를 빼는 것이 답이다.
#    ⚠️ 배포 파일 이름은 `_` 로 시작하지 않는다. `_tmp-*` 같은 작업 파일만 `_` 를 쓴다(위 exclude).
