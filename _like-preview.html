<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCF9F5">
<title>좋아요 하트 — 미리보기</title>
<style>
  /* 🔴 앱을 그대로 띄워 놓고 CSS 만 갈아 끼운다(2026-08-05). 카드 마크업을 베껴 오지 않는 이유는,
     베낀 목업은 진짜와 조금씩 어긋나서 「목업에선 괜찮았는데」가 생기기 때문이다.
     여기서 고른 것을 그대로 styles.css 에 넣으면 된다 — 앱 파일은 아직 안 건드렸다. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2B120D; }
  body { display: flex; flex-direction: column;
         font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

  .bar { flex: none; padding: 8px 8px 9px; background: #2B120D; color: #fff; }
  .bar h1 { margin: 0 0 7px; font-size: 12px; font-weight: 700; letter-spacing: -.2px; }
  .bar h1 span { color: #FFB4A2; font-weight: 500; }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; padding: 9px 4px; border: 1px solid rgba(255,255,255,.22); border-radius: 9px;
                 background: rgba(255,255,255,.06); color: #fff; font-family: inherit;
                 font-size: 11.5px; font-weight: 700; line-height: 1.35; }
  .btns button b { display: block; font-size: 12.5px; }
  .btns button small { display: block; font-weight: 500; font-size: 10.5px; color: #E0BFB6; }
  .btns button.on { background: #E0301E; border-color: #E0301E; }

  .tip { margin: 7px 0 0; font-size: 10.5px; line-height: 1.5; color: #D8BCB4; }

  iframe { flex: 1; width: 100%; border: 0; display: block; background: #FCF9F5; }
</style>
</head>
<body>

<div class="bar">
  <h1>좋아요 하트 미리보기 <span>— 눌러서 갈아 끼우세요</span></h1>
  <div class="btns" id="btns"></div>
  <p class="tip" id="tip"></p>
</div>

<iframe id="app" src="index.html" title="하딜고고"></iframe>

<script>
/* 하트가 쓰이는 곳 둘
   .hp-like     = 홈 「인기 소스」 가로 카드
   .hc-row-like = 레시피 카드·목록 (이름이 가장 많이 잘리는 곳) */
var 안 = [
  {
    이름: '1 · 지금',
    설명: '하트 옆에 숫자',
    css: '',
    말: '지금 판. 320px 에서 이름칸이 인기소스 43px · 레시피 59px 이라 이름이 「건희…」 「쑨디2호…」로 잘린다.'
  },
  {
    이름: '2 · 숫자를 아래로',
    설명: '터치 28px',
    css: '.hp-like{flex-direction:column;min-width:0;gap:1px}'
       + '.hc-row-like{flex-direction:column;gap:1px}',
    말: '이름칸이 인기소스 43→61px · 레시피 59→79px 로 넓어진다(재서 확인). 카드 높이는 안 변한다. '
       + '다만 손가락이 닿는 영역이 가로 28px 로 줄어든다(세로는 59px 로 넉넉).'
  },
  {
    이름: '3 · 숫자를 아래로',
    설명: '터치 44px 지킴',
    css: '.hp-like{flex-direction:column;min-width:0;gap:1px;padding:12px;margin:-12px}'
       + '.hc-row-like{flex-direction:column;gap:1px;padding:12px;margin:-12px}',
    말: '2번과 보이는 것은 똑같고, 닿는 영역만 44px 로 되돌린다(안쪽 여백 +12, 바깥 여백 -12 — 앱이 이미 위아래로 쓰는 수법). '
       + '대가: 닿는 영역이 이름 쪽으로 12px 넘어와, 이름 끝을 누르면 좋아요가 눌릴 수 있다.'
  }
];

var 지금 = 0;
var iframe = document.getElementById('app');

document.getElementById('btns').innerHTML = 안.map(function (m, i) {
  return '<button type="button" data-i="' + i + '"><b>' + m.이름 + '</b><small>' + m.설명 + '</small></button>';
}).join('');

function 입히기() {
  var d = iframe.contentDocument;
  if (!d) return;
  var el = d.getElementById('__미리보기');
  if (!el) { el = d.createElement('style'); el.id = '__미리보기'; d.head.appendChild(el); }
  el.textContent = 안[지금].css;
  [].forEach.call(document.querySelectorAll('#btns button'), function (b, i) {
    b.classList.toggle('on', i === 지금);
  });
  document.getElementById('tip').textContent = 안[지금].말;
}

document.getElementById('btns').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  지금 = +b.dataset.i;
  입히기();
});

iframe.addEventListener('load', 입히기);   // 앱 안에서 새로고침해도 고른 안이 유지된다
입히기();
</script>
</body>
</html>
