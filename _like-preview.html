<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2B120D">
<title>좋아요 하트 — 미리보기</title>
<style>
  /* 🔴 앱을 그대로 띄워 놓고 CSS 만 갈아 끼운다(2026-08-05). 카드 마크업을 베껴 오지 않는 이유는,
     베낀 목업은 진짜와 조금씩 어긋나서 「목업에선 괜찮았는데」가 생기기 때문이다.
     여기서 고른 것을 그대로 styles.css 에 넣으면 된다 — 앱 파일은 아직 안 건드렸다. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2B120D; }
  body { display: flex; flex-direction: column;
         font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

  /* 🔴 조작판이 화면을 많이 먹으면 정작 앱을 못 본다 — 촘촘하게 두고 접을 수 있게 한다 */
  .bar { flex: none; padding: 5px 6px 6px; background: #2B120D; color: #fff; }
  .줄 { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .딱지 { flex: none; width: 40px; font-size: 9.5px; font-weight: 700; color: #E8A99C; letter-spacing: -.4px; }
  .칸 { flex: 1; display: flex; gap: 4px; }
  .칸 button { flex: 1; padding: 4px 2px; border: 1px solid rgba(255,255,255,.2); border-radius: 7px;
               background: rgba(255,255,255,.06); color: #fff; font-family: inherit;
               font-size: 10.5px; font-weight: 700; line-height: 1.25; }
  .칸 button small { display: block; font-weight: 500; font-size: 8.5px; color: #D7B7AE; }
  .칸 button.on { background: #E0301E; border-color: #E0301E; }
  .칸 button.on small { color: #FFD9D2; }

  .tip { margin: 5px 0 0; font-size: 9.5px; line-height: 1.45; color: #D8BCB4; }

  /* 접기 — 고른 것은 그대로 두고 조작판만 감춘다 */
  .접기 { display: block; width: 100%; margin-top: 5px; padding: 5px; border: 0; border-radius: 7px;
          background: rgba(255,255,255,.12); color: #fff; font-family: inherit; font-size: 10.5px; font-weight: 700; }
  body.접힘 .줄, body.접힘 .tip { display: none; }
  body.접힘 .접기 { margin-top: 0; }

  iframe { flex: 1; width: 100%; border: 0; display: block; background: #FCF9F5; }
</style>
</head>
<body>

<div class="bar">
  <div class="줄"><span class="딱지">배치</span><span class="칸" id="배치"></span></div>
  <div class="줄"><span class="딱지">숫자 크기</span><span class="칸" id="크기"></span></div>
  <div class="줄"><span class="딱지">숫자 굵기</span><span class="칸" id="굵기"></span></div>
  <div class="줄"><span class="딱지">숫자 밀기</span><span class="칸" id="밀기"></span></div>
  <div class="줄"><span class="딱지">숫자 나란히</span><span class="칸" id="나란히"></span></div>
  <div class="줄"><span class="딱지">돋보기</span><span class="칸" id="돋보기"></span></div>
  <p class="tip" id="tip"></p>
  <button type="button" class="접기" id="접기">조작판 접기 ▲</button>
</div>

<iframe id="app" src="index.html" title="하딜고고"></iframe>

<script>
/* 하트가 쓰이는 곳 둘
   .hp-like     = 홈 「인기 소스」 가로 카드 (숫자는 .like-count)
   .hc-row-like = 레시피 카드·목록 (숫자는 .hc-row-like-n) — 이름이 가장 많이 잘리는 곳 */

var 배치안 = [
  { 이름: '1 · 지금', 밑: '옆에 숫자', css: '',
    말: '지금 판. 320px 에서 이름칸이 인기소스 43px · 레시피 59px 이라 「건희…」 「쑨디2호…」로 잘린다.' },
  { 이름: '2 · 아래로', 밑: '터치 28px',
    css: '.hp-like{flex-direction:column;min-width:0;gap:1px}.hc-row-like{flex-direction:column;gap:1px}',
    말: '이름칸이 인기소스 43→61px · 레시피 59→79px 로 넓어진다(재서 확인). 카드 높이는 안 변한다. 손가락 닿는 영역은 가로 28px(세로 59px).' },
  { 이름: '3 · 아래로', 밑: '터치 44px',
    css: '.hp-like{flex-direction:column;min-width:0;gap:1px;padding:12px;margin:-12px}.hc-row-like{flex-direction:column;gap:1px;padding:12px;margin:-12px}',
    말: '2번과 보이는 것은 똑같고 닿는 영역만 44px 로 되돌린다. 대가: 영역이 이름 쪽으로 12px 넘어와 이름 끝을 누르면 좋아요가 눌릴 수 있다.' }
];

/* 🔴 숫자를 줄여도 **폭은 안 줄어든다** — 폭을 정하는 것은 아이콘(20px)이고 숫자는 이미 그보다 좁다
   (14px 일 때 "21" 이 15px). 달라지는 것은 높이(59→56px)와 모양뿐이다. 재서 확인했다. */
var 크기안 = [
  { 이름: '14px', 밑: '지금', px: null },
  { 이름: '12px', 밑: '', px: 12 },
  { 이름: '11px', 밑: '', px: 11 },
  { 이름: '10px', 밑: '', px: 10 }
];

/* 🔴 숫자가 하트보다 굵다 — 재서 확인(14px 기준 획 두께):
   하트 선 1.67px(stroke-width 2 를 20px 로 그림) · 숫자 700 = 2.00px · 600 = 2.00px · 500 = 1.75px · 400 = 1.50px.
   옆으로 나란할 땐 티가 덜 나는데 **위아래로 겹치면** 굵기 차이가 바로 보인다.
   500 이 하트와 거의 같다(1.75 vs 1.67). */
var 굵기안 = [
  { 이름: '700', 밑: '지금', w: null },
  { 이름: '600', 밑: '', w: 600 },
  { 이름: '500', 밑: '하트와 같음', w: 500 },
  { 이름: '400', 밑: '', w: 400 }
];

/* 🔴 강제로 미는 것은 `position:relative; left` 로 한다 — **자리를 안 차지해서** 하트칸 폭도
   이름칸도 안 바뀐다. margin 이나 padding 으로 밀면 칸이 같이 넓어져 이름칸을 도로 깎아먹는다.
   0.5px 은 레티나(2배·3배 화면)에서 실제 화소 1개라 눈에 보인다. */
var 밀기안 = [
  { 이름: '0', 밑: '지금', px: null },
  { 이름: '+0.5', 밑: '', px: 0.5 },
  { 이름: '+1', 밑: '', px: 1 },
  { 이름: '−0.5', 밑: '', px: -0.5 }
];

/* 🔴 치우침은 「1」이 든 숫자에서만 생긴다(21·11 이 0.42px 왼쪽, 나머지는 0.00px) — 「1」 글자의
   잉크가 제 칸에서 왼쪽에 놓이기 때문이다. tabular-nums 는 모든 숫자에 같은 폭을 줘서
   「1」도 제 칸 가운데에 놓이게 한다. **원인을 없애는 쪽**이고, 미는 것은 평균으로 때우는 쪽이다.
   Pretendard 가 지원하는 것을 확인했다("11"과 "88"의 폭이 같아진다).
   폭은 12.6 → 17.6px 로 커지지만 아이콘(20px)보다 작아서 **이름칸은 안 줄어든다.** */
var 나란히안 = [
  { 이름: '끄기', 밑: '지금', 켬: false },
  { 이름: '켜기', 밑: 'tabular-nums', 켬: true }
];

var 돋보기안 = [
  { 이름: '끄기', 밑: '', 켬: false },
  { 이름: '4배로 떼어 보기', 밑: '가운데선 표시', 켬: true }
];

var 고른 = { 배치: 0, 크기: 0, 굵기: 0, 밀기: 0, 나란히: 0, 돋보기: 0 };
var iframe = document.getElementById('app');

function 버튼그리기(칸id, 목록, 키) {
  document.getElementById(칸id).innerHTML = 목록.map(function (m, i) {
    return '<button type="button" data-키="' + 키 + '" data-i="' + i + '">' + m.이름
         + (m.밑 ? '<small>' + m.밑 + '</small>' : '') + '</button>';
  }).join('');
}
버튼그리기('배치', 배치안, '배치');
버튼그리기('크기', 크기안, '크기');
버튼그리기('굵기', 굵기안, '굵기');
버튼그리기('밀기', 밀기안, '밀기');
버튼그리기('나란히', 나란히안, '나란히');
버튼그리기('돋보기', 돋보기안, '돋보기');

function 입히기() {
  var d = iframe.contentDocument;
  if (!d || !d.head) return;
  var el = d.getElementById('__미리보기');
  if (!el) { el = d.createElement('style'); el.id = '__미리보기'; d.head.appendChild(el); }
  var css = 배치안[고른.배치].css;
  var px = 크기안[고른.크기].px;
  var w = 굵기안[고른.굵기].w;
  // 🔴 인기소스는 숫자가 `.like-count` 인데 굵기가 부모(.hp-like)에 걸려 있다 — 둘 다 적어야 먹는다
  if (px) css += '.like-count,.hc-row-like-n{font-size:' + px + 'px}';
  if (w) css += '.hp-like,.like-count,.hc-row-like-n{font-weight:' + w + '}';
  var 밀 = 밀기안[고른.밀기].px;
  if (밀) css += '.like-count,.hc-row-like-n{position:relative;left:' + 밀 + 'px}';
  if (나란히안[고른.나란히].켬) css += '.like-count,.hc-row-like-n{font-variant-numeric:tabular-nums}';
  el.textContent = css;

  돋보기그리기(d);

  [].forEach.call(document.querySelectorAll('.칸 button'), function (b) {
    b.classList.toggle('on', 고른[b.dataset['키']] === +b.dataset.i);
  });
  document.getElementById('tip').textContent = 배치안[고른.배치].말;
}

/* 하트 둘을 떼어 4배로 키우고 **칸의 정가운데에 선**을 긋는다.
   🔴 앱 안에서 그대로 키우면 카드끼리 겹쳐서 아무것도 못 읽는다 — 그래서 떼어 낸다. */
function 돋보기그리기(d) {
  var 판 = d.getElementById('__돋보기');
  if (판) 판.remove();
  if (!돋보기안[고른.돋보기].켬) return;
  var 원본 = [].slice.call(d.querySelectorAll('.hp-like, .hc-row-like'))
              .filter(function (e) { return e.getBoundingClientRect().width; });
  if (!원본.length) return;
  var 고름 = [], 본 = {};
  원본.forEach(function (e) {
    var t = e.textContent.trim();
    if (!본[t] && 고름.length < 2) { 본[t] = 1; 고름.push(e); }
  });
  판 = d.createElement('div');
  판.id = '__돋보기';
  판.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;display:flex;'
                   + 'align-items:center;justify-content:space-evenly;';
  고름.forEach(function (e) {
    var 통 = d.createElement('div');
    통.style.cssText = 'position:relative;width:150px;height:280px;display:flex;align-items:center;justify-content:center;';
    var 복 = e.cloneNode(true);
    복.style.cssText = 'flex-direction:column;gap:1px;transform:scale(4);transform-origin:center;'
                     + 'color:#4D4139;margin:0;padding:0;';
    var 선 = d.createElement('div');
    선.style.cssText = 'position:absolute;left:50%;top:0;bottom:0;width:1px;background:#E0301E;';
    통.appendChild(복); 통.appendChild(선); 판.appendChild(통);
  });
  d.body.appendChild(판);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('.칸 button'); if (!b) return;
  고른[b.dataset['키']] = +b.dataset.i;
  입히기();
});

document.getElementById('접기').addEventListener('click', function () {
  var 접힘 = document.body.classList.toggle('접힘');
  this.textContent = 접힘 ? '조작판 펴기 ▼' : '조작판 접기 ▲';
});

iframe.addEventListener('load', 입히기);   // 앱 안에서 새로고침해도 고른 것이 유지된다
입히기();
</script>
</body>
</html>
