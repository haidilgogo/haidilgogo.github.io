<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 탭 구상 — 하딜고고</title>
<!-- 🔴 목업이다. 앱 파일은 한 줄도 안 건드렸다.
     앱의 진짜 styles.css를 그대로 불러와 색·글꼴·카드 모양이 실제와 같게 했다. -->
<link rel="stylesheet" href="styles.css?v=635">
<style>
/* 🔴 앱은 JS(syncTopbarH)가 상단바 실제 높이를 --topbar-h 에 넣어준다. 목업엔 그 JS 가 없어서
   값이 비면 0 이 되고, 앱 스타일을 그대로 쓰는 시트(.stamp-sheet-overlay)가 상단바를 덮는다.
   목업 상단바는 65px 고정이라 여기서 직접 넣는다. */
:root { --topbar-h: 65px; }

/* ── 목업 껍데기 (앱에 이미 있는 것은 안 적었다) ───────────────── */
body { background: var(--bg-card); }
/* 아래 여백은 앱 값(.main padding-bottom 92px = 탭바 자리)을 그대로 쓴다.
   「다음」 버튼이 있던 시절의 156px 은 버튼과 함께 없앴다. */
.mk-note { max-width:440px; margin:0 auto; padding:10px 20px; font-size:12px; color:var(--text-muted); }

.topbar-inner { display:flex; align-items:center; justify-content:space-between; }
.mk-sec-title { font-size:15px; font-weight:700; color:var(--text-dark); }

/* ── 담은 목록(왼쪽 고정) + 분류 탭(오른쪽 가로 스크롤) 한 줄 ────── */
/* 🔴 붙박이(sticky)와 아래 구분선을 뗐다(2026-08-02 사용자 확정) — 매장 탭의 지역 탭줄과 같은 구조다.
   앱에서 아래 구분선이 있는 곳은 상단바 하나뿐이고, 탭줄에는 어느 화면에도 선이 없다.
   선은 붙박이 시절 「카드가 탭 밑으로 파고드는 것」을 가리려던 것이라 붙박이와 함께 사라진다. */
.mn-bar {
  display:flex; align-items:stretch;
}
/* 🔴 담은 목록은 상단바 오른쪽 장바구니 아이콘으로 옮겼다(2026-08-02 사용자 확정).
   분류 탭 줄이 전체 폭을 쓰게 되어 320px 에서 여유가 65px 늘었다.
   🔴 숫자는 여전히 안 넣는다(앞선 확정) — 담긴 게 있으면 점만 찍는다. */
.mk-top-right { margin-left:auto; display:flex; align-items:center; gap:2px; }
.mk-icon-btn {
  position:relative; width:40px; height:40px; border:0; background:none;
  display:flex; align-items:center; justify-content:center;
  color:#4D4139; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.mk-pot { position:relative; width:18px; height:18px; display:block; color:#4D4139; }
.mk-pot svg { position:absolute; inset:0; }
/* 기본 = 선만. 담기면 김이 빨갛게 켜지고, 누르면 채움으로 바뀐다
   🔴 `.mk-pot svg` 보다 약한 선택자로 숨기면 안 먹는다(우선순위) — 반드시 `.mk-pot` 를 앞에 붙일 것 */
.mk-pot .mk-pot-line { display:block; }
.mk-pot .mk-pot-steam,
.mk-pot .mk-pot-fill,
.mk-pot .mk-pot-fill-steam { display:none; }
.mk-pot .mk-pot-steam { color:var(--brand-red); }
.mk-pot.has-item .mk-pot-steam { display:block; }
/* 누름 = 즐겨찾기와 같은 방식(채워진 도형 + 브랜드 빨강) */
.mk-icon-btn:active .mk-pot .mk-pot-line,
.mk-icon-btn:active .mk-pot .mk-pot-steam { display:none; }
.mk-icon-btn:active .mk-pot { color:var(--brand-red); }
.mk-icon-btn:active .mk-pot .mk-pot-fill { display:block; }
.mk-icon-btn:active .mk-pot.has-item .mk-pot-fill { display:none; }
.mk-icon-btn:active .mk-pot.has-item .mk-pot-fill-steam { display:block; }

/* 분류 탭 — 담은 목록 오른쪽에서 가로로 스크롤된다 */
.mn-tabs {
  flex:1; min-width:0;
  display:flex; gap:20px; overflow-x:auto; white-space:nowrap;
  padding:12px 0 10px;
}
.mn-tab {
  flex:none; background:none; border:0; padding:0 0 4px;
  font-size:15px; font-weight:600; color:var(--text-muted);
  font-family:inherit; cursor:pointer; position:relative;
}
.mn-tab.is-on { color:var(--text-dark); font-weight:800; }
.mn-tab.is-on::after {
  content:''; position:absolute; left:0; right:0; bottom:0;
  height:2px; border-radius:1px; background:var(--brand-red);
}
/* 하위 분류 줄 — 상위 탭 아래, 전체 폭을 쓴다.
   🔴 밑줄을 쓰지 않는다: 위 상위 탭과 「1 맛/2가지 맛」이 이미 밑줄이라
   세 줄이 다 같아 보이면 위아래가 안 읽힌다(2026-08-02 화면으로 대보고 정함). */
.mn-subs {
  display:flex; gap:14px; overflow-x:auto; white-space:nowrap;
  padding:2px 20px 10px;
}
.mn-sub {
  flex:none; background:none; border:0; padding:0;
  font-size:14px; font-weight:500; color:var(--text-muted);
  font-family:inherit; cursor:pointer;
}
.mn-sub.is-on { color:var(--brand-red); font-weight:800; }
.mn-tab-dot {
  display:inline-block; min-width:16px; height:16px; margin-left:4px; padding:0 4px;
  border-radius:8px; background:var(--brand-red); color:#fff;
  font-size:10px; font-weight:800; line-height:16px; text-align:center; vertical-align:1px;
}

/* ── 전골: 냄비 (CSS로 그린다 — 그림 파일 안 씀) ────────────────── */
/* 칸 수는 화살표가 아니라 글씨를 눌러 고른다(2026-08-02 사용자 지시) */
.mn-pot-seg { display:flex; justify-content:center; gap:26px; padding:20px 0 18px; }
/* 🔴 알약(둥근 배경) 쓰지 않는다 — 앱의 탭과 같은 밑줄 방식으로 맞춘다 */
.mn-pot-seg button {
  border:0; background:none; font-family:inherit; position:relative;
  font-size:15px; font-weight:600; color:var(--text-muted);
  padding:0 0 5px; cursor:pointer;
}
.mn-pot-seg button.is-on { color:var(--text-dark); font-weight:800; }
.mn-pot-seg button.is-on::after {
  content:''; position:absolute; left:0; right:0; bottom:0;
  height:2px; border-radius:1px; background:var(--brand-red);
}
/* 냄비는 가운데, 고른 육수 목록은 그 아래 (2026-08-02 사용자 제안).
   🔴 옆에 두면 냄비와 글자가 폭을 나눠 써서 좁은 기기(360px 이하)에서 이름이 감겼다.
   아래로 내리면 글자가 화면 폭을 다 쓰므로 어느 기기에서도 안 감긴다. */
/* 아래 padding = 「비어 있음」 줄과 구분선 사이 간격. 4px 은 너무 좁았다(2026-08-02)
   구분선 = 냄비(전골 짜는 곳)와 탕 목록을 나눈다. 색은 앱 상단바와 같은 은은한 회백색이다. */
.mn-pot-wrap {
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:0 0 24px; margin:0 0 24px; border-bottom:1px solid #ECE5DC;
}
/* 2×2 배치 — 번호 자리가 냄비와 같아서 1번이 왼쪽 위라는 게 그대로 읽힌다.
   ⚠️ 320px에서 한 칸 135px에 내용물이 약 125px이라 여유가 10px뿐이다.
      지금보다 긴 육수 이름이 생기면 여기서 먼저 두 줄이 된다. */
.mn-pot-side { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:14px 10px; }
/* 1맛일 때는 줄이 하나뿐이라 2열 격자의 왼쪽에만 놓여 오른쪽이 비어 보인다 → 가운데로 */
.mn-pot-side.is-one { grid-template-columns:auto; justify-content:center; }
.mn-pot-row { display:flex; gap:7px; align-items:center; font-size:13px; line-height:1.35; }
.mn-pot-row b {
  /* 냄비 안 23px보다 작게 — 목록에서는 이름이 주인공이고 번호는 거들기만 하면 된다 */
  flex:none; width:20px; height:20px; border-radius:5px;
  background:rgba(28,12,8,.45); color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.mn-pot-row.is-empty { color:var(--text-muted); }
.mn-pot-row.is-empty b { background:#DED0C4; }
/* ✕ 는 칸 수와 상관없이 이름 바로 옆에 붙인다(2026-08-02 사용자 확정).
   전에는 2·4칸만 margin-left:auto 로 칸 오른쪽 끝에 떨어져 있어 1칸일 때와 모양이 달랐다. */
.mn-row-x {
  margin-left:2px; flex:none; border:0; background:none; padding:0 0 0 6px;
  color:var(--text-muted); font-size:14px; cursor:pointer; font-family:inherit;
}
/* 🔴 이름 칸을 가장 긴 육수 이름에 맞춰 74px 로 고정했다(2026-08-02 사용자 확정) —
   이름 길이와 상관없이 ✕ 가 늘 같은 자리에 오게 하려는 것이다.
   74px = 「고수 듬뿍 훠궈」를 실제로 넣고 잰 폭(둘째로 긴 것들은 68px).
   ⚠️ 이보다 긴 육수 이름이 생기면 이 값을 다시 재서 고칠 것. 320px·4칸에서 한 칸이 135px 이고
      배지 20 + 사이 7 + 이름 74 + 2 + ✕ 17 = 120px 이라 여유는 15px 뿐이다. */
.mn-pot-row span { min-width:74px; word-break:keep-all; color:var(--text-dark); font-weight:700; }
.mn-pot-row.is-empty span { color:var(--text-muted); font-weight:600; }
/* 🔴 실제 하이디라오 태블릿 화면을 따랐다(2026-08-02 사용자 사진).
   흰 냄비 테 + 칸을 가르는 흰 선 + 가운데 모인 번호 배지. 칸마다 붙던 이름 띠는 뺐다. */
.mn-pot {
  /* 목록을 아래로 내려 폭 경쟁이 없어졌으므로 냄비를 키웠다(196 → 220px). */
  width:220px; height:220px; flex:none; border-radius:28px; padding:12px;
  background:#F3E9DA; border:1px solid #E0D0B4;   /* 바깥 테 = 크림 */
}
.mn-pot-inner {
  position:relative;
  width:100%; height:100%; border-radius:16px; overflow:hidden;
  display:grid; gap:2px; background:#fff;   /* 안쪽 = 흰색. 이 색이 그대로 칸 구분선이 된다 */
}
/* 번호는 칸이 만나는 가운데에 모인다 */
.mn-pot-nums {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:grid; gap:2px; pointer-events:none;
}
.mn-pot-nums[data-cells="2"] { grid-template-columns:1fr 1fr; }
.mn-pot-nums[data-cells="4"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
/* 🔴 번호 배지는 그림마다 색을 바꾸지 않는다(2026-08-02 사용자 지시).
   태블릿처럼 반투명 검정 + 흰 글씨 하나로 통일한다 — 어떤 국물 위에서도 같게 보인다. */
.mn-pot-num {
  width:23px; height:23px; border-radius:5px;
  background:rgba(28,12,8,.45); color:#fff; font-size:12.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.mn-pot-inner[data-cells="1"] { grid-template-columns:1fr; grid-template-rows:1fr; }
.mn-pot-inner[data-cells="2"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr; }
.mn-pot-inner[data-cells="4"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.mn-cell {
  background:#E7D9C2; cursor:pointer;   /* 빈 칸 = 진한 크림 */
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  position:relative;                    /* 🔴 padding 두지 말 것 — 그림이 모서리까지 안 찬다 */
}
.mn-cell img { display:block; }
.mn-cell img { width:100%; height:100%; object-fit:cover; }
.mn-cell-name {
  position:absolute; left:0; right:0; bottom:0; padding:3px 4px;
  background:rgba(0,0,0,.5); color:#fff; font-size:10px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mn-pot-label { text-align:center; font-size:15px; font-weight:800; color:var(--text-dark); }
.mn-pot-list {
  display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px;
  padding:10px 0 2px; font-size:12.5px; color:var(--text-dark);
}
.mn-pot-list b {
  display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; margin-right:4px; border-radius:4px;
  background:#A8823C; color:#fff; font-size:11px; vertical-align:-3px;
}
.mn-pot-hint  { text-align:center; font-size:12.5px; color:var(--text-muted); margin:0 0 8px; }

/* ── 카드 2칸 ─────────────────────────────────────────────────── */
/* ── 메뉴 줄(리스트) ─────────────────────────────────────
   🔴 격자 2열이 아니라 리스트다(2026-08-02 사용자 확정).
   이유: 이름 아래 부제를 넣기로 했는데 격자 카드엔 그 자리가 좁고,
   320px에서 긴 이름이 두 줄로 감겼다. 리스트는 이름·부제·담기가 한 줄에 들어간다.
   🔴 그림 80px 은 상한선이다 — 88px 로 키우면 320px 에서 「이베리코 흑돼지목살」이 잘린다(재서 확인). */
.mn-grid { display:block; }
.mn-card {
  position:relative; display:flex; align-items:center; gap:12px;
  width:100%; margin:0 0 8px; padding:10px 12px; text-align:left;
  background:#fff; border:1px solid var(--card-border); border-radius:12px;
  font-family:inherit; cursor:pointer;
}
.mn-card.is-on { border-color:var(--brand-red); border-width:2px; }
.mn-card:active { transform:translateY(1px); }
.mn-card[data-broth]:active { border-color:var(--brand-red); transform:scale(.97); }
@media (hover:hover) { .mn-card[data-broth]:hover { border-color:var(--card-hover-border); } }
.mn-card-thumb {
  flex:none; width:80px; height:80px; border-radius:8px;
  background:#FBF4E6; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.mn-card-thumb img { width:100%; height:100%; object-fit:contain; }
.mn-card-thumb.is-text { background:var(--bg-cream); font-size:12px; font-weight:800; color:#7C6A60; text-align:center; line-height:1.25; padding:6px; word-break:keep-all; }
/* 글자 뭉치는 늘 세로 가운데 — 부제가 없어도 줄이 흔들리지 않는다(높이는 그림 80px 이 정한다) */
.mn-card-body { flex:1; min-width:0; }
.mn-card-name {
  display:block; font-size:15px; font-weight:700; color:var(--text-dark);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mn-card-sub {
  display:block; margin-top:2px; font-size:12px; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mn-card-check {
  flex:none; width:28px; height:28px; border-radius:50%;
  border:1.5px solid var(--card-border); display:flex; align-items:center; justify-content:center;
  font-size:14px; color:#C9BCA8;
}
.mn-card.is-on .mn-card-check { border-color:var(--brand-red); background:var(--brand-red); color:#fff; }
/* ── 그림 확대 모달 ────────────────────────────────────────
   🔴 그림(줄의 29%)을 누르면 뜨고, 나머지 71%는 바로 담긴다(2026-08-02 확정).
   담으려다 잘못 눌러도 여기서 바로 담을 수 있게 **모달 안에도 담기 버튼**을 둔다.
   닫기 버튼은 앱의 다른 모달과 같은 것을 쓴다(.stamp-sheet-close · 18px X 아이콘). */
.mn-zoom-dim {
  /* 🔴 상단바를 덮지 않는다 — 앱의 모달·시트가 전부 이 규칙이다
     (styles.css 의 .modal-overlay·.stamp-sheet-overlay 둘 다 @media 에서 top 을 내린다).
     숫자를 박지 말 것 — 앱은 JS(syncTopbarH)가 --topbar-h 에 실제 높이를 넣어준다. */
  position:fixed; top:var(--topbar-h, 65px); left:0; right:0; bottom:0; z-index:60;
  display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(45,34,28,.5);
}
.mn-zoom {
  position:relative; width:100%; max-width:300px; padding:16px 16px 18px;
  background:#FBF4E6; border-radius:20px; text-align:center;
  box-shadow:0 14px 44px rgba(0,0,0,.22);
}
.mn-zoom-img { width:100%; aspect-ratio:1/1; object-fit:contain; display:block; }
.mn-zoom-name { display:block; margin-top:10px; font-size:17px; font-weight:800; color:var(--text-dark); word-break:keep-all; }
.mn-zoom-sub { display:block; margin-top:3px; font-size:12.5px; color:var(--text-muted); }
.mn-zoom-add {
  margin-top:14px; width:100%; padding:12px 0; border:0; border-radius:12px;
  background:var(--brand-red); color:#fff; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer;
}
.mn-zoom-add.is-on { background:#fff; color:var(--brand-red); box-shadow:inset 0 0 0 2px var(--brand-red); }

/* ── 육수 줄 ────────────────────────────────────────────
   🔴 전골도 리스트다(2026-08-02 사용자 확정). 격자를 남기지 않는다.
   썸네일은 카드용(냄비째)을 쓴다 — 타일(국물만)로 해봤더니 냄비가 사라져
   「고르는 화면」이라는 게 안 읽혔다. 타일은 위 냄비 칸 안에서만 쓴다. */
.mn-card--broth:active { transform:scale(.99); }

/* 「일부 매장」·「제주 한정」은 부제 자리에 붙는다(리스트라 배지를 얹을 자리가 없다) */
.mn-card-part { color:#8A7468; }
.mn-card-part::before { content:'· '; }
.mn-card-sub:empty + .mn-card-part::before,
.mn-card-name + .mn-card-part::before { content:''; }

/* 개수+안내문 줄 — 모양은 앱의 .stores-head 를 그대로 쓰고, 메뉴에서만 다른 간격만 여기서 준다 */
.mn-head { margin-bottom:10px; }
.mn-head .stores-note { word-break:keep-all; }

/* 🔴 하단 고정 「다음」 버튼은 뺐다(2026-08-02 사용자 확정) — 분류 탭이 위에 늘 있고
   담은 것은 상단바 냄비 아이콘으로 보므로 아래 버튼이 하는 일이 없었다.
   미정으로 남아 있던 「버튼 문구」도 이걸로 없어진 문제가 됐다. */

/* ── 담은 목록 모달 (앱의 .stamp-sheet 를 그대로 쓴다) ─────────────── */
.mn-sheet-head { display:flex; padding-right:34px; align-items:center; gap:8px; margin-bottom:10px; }
.mn-sheet-title { font-size:16px; font-weight:800; color:var(--text-dark); }
.mn-sheet-clear { margin-left:auto; background:none; border:0; font-family:inherit; font-size:13px; color:var(--text-muted); text-decoration:underline; cursor:pointer; }
.mn-sheet-group { font-size:12.5px; font-weight:800; color:var(--text-muted); margin:12px 0 6px; }
.mn-sheet-item { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #EFE4D6; font-size:14px; color:var(--text-dark); }
.mn-sheet-x { margin-left:auto; background:none; border:0; color:var(--text-muted); font-size:15px; cursor:pointer; }
.mn-sheet-empty { padding:26px 0; text-align:center; font-size:14px; color:var(--text-muted); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="topbar-brand" type="button">
      <img class="topbar-logo-mark" src="assets/icons/logo-mark-color-v2.png?v=1" width="25" height="22" alt="">

             원본 두께 그대로 쓴다 — 잉크 양을 재보니 공유 아이콘(24.86%)과 25.29%로 거의 같다. -->

          <svg class="mk-pot-fill-steam" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><g transform="translate(0,24) scale(0.004687500,-0.004687500)">     <path d="M267 5106 c-48 -18 -76 -42 -93 -83 -31 -73 -14 -121 73 -208 51 -51     73 -98 73 -161 0 -51 -45 -126 -100 -168 -218 -166 -280 -435 -158 -686 34     -71 121 -166 178 -195 79 -41 171 -10 210 70 34 69 22 114 -50 190 -71 74 -90     110 -90 171 0 67 32 126 95 178 99 80 151 155 189 268 67 200 24 400 -115 539     -87 87 -143 109 -212 85z"/>     <path d="M1015 5105 c-75 -26 -116 -99 -101 -179 4 -23 26 -54 69 -97 47 -48     67 -77 76 -111 22 -77 -1 -154 -61 -206 -135 -116 -177 -169 -217 -277 -31     -82 -38 -218 -17 -308 42 -180 185 -341 302 -339 100 1 168 93 142 190 -6 23     -31 57 -65 91 -65 64 -83 101 -83 171 0 72 28 120 108 184 141 114 207 254     205 436 -2 138 -49 257 -142 355 -83 88 -145 114 -216 90z"/>     <path d="M4013 5109 c-43 -12 -90 -62 -102 -107 -17 -59 2 -109 66 -170 63     -61 83 -102 83 -169 -1 -73 -29 -124 -102 -181 -145 -114 -213 -257 -211 -442     2 -167 76 -315 206 -414 123 -94 281 -1 253 148 -5 25 -26 54 -70 99 -52 52     -65 73 -76 115 -19 82 3 148 68 204 89 78 153 150 181 207 102 201 72 446 -74     609 -76 85 -155 121 -222 101z"/>     <path d="M4755 5105 c-76 -27 -117 -105 -96 -182 8 -29 26 -55 62 -87 64 -57     89 -105 89 -170 0 -74 -29 -124 -113 -193 -85 -70 -140 -147 -175 -247 -31     -88 -36 -239 -9 -324 37 -121 136 -255 218 -298 98 -50 214 11 226 119 7 56     -18 104 -79 156 -100 86 -104 218 -9 305 159 146 204 210 236 341 45 181 -23     404 -159 521 -75 65 -128 82 -191 59z"/>     <path d="M1925 4821 c-102 -25 -100 -18 -220 -638 -58 -296 -107 -548 -110     -560 l-5 -23 960 0 c718 0 960 3 960 12 0 30 -213 1095 -224 1123 -8 18 -31     45 -52 61 l-37 29 -621 2 c-342 1 -634 -2 -651 -6z"/>     <path d="M90 3282 c-19 -9 -45 -32 -57 -51 -20 -29 -23 -47 -23 -126 0 -110     29 -288 65 -405 15 -47 55 -143 89 -215 100 -207 215 -364 397 -540 609 -589     1598 -858 2548 -694 637 110 1204 411 1565 830 112 130 173 220 247 364 102     196 150 365 171 587 11 130 11 135 -10 179 -15 30 -35 53 -61 67 l-39 22     -2428 0 c-2293 0 -2431 -1 -2464 -18z"/>     <path d="M1156 1179 c-19 -55 -136 -685 -136 -729 1 -220 167 -409 385 -440     91 -13 2206 -13 2295 0 91 13 194 67 259 135 89 94 141 242 125 354 -10 71     -133 684 -138 689 -3 2 -38 -9 -78 -26 -267 -111 -572 -191 -883 -232 -227     -29 -653 -29 -870 1 -299 41 -587 114 -830 211 -55 22 -106 42 -112 45 -7 3     -15 -1 -17 -8z"/>   </g></svg>
        </span>
      </button>
      <button class="mk-icon-btn" type="button" aria-label="친구에게 공유">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <!-- 🔴 개수(왼쪽) + 안내문(오른쪽) 한 줄 — 분류 탭보다 위, 화면 맨 윗줄이다(2026-08-02 사용자 확정).
       매장 탭과 같은 서식이라 앱의 진짜 클래스(.stores-head/.count-line/.stores-note)를 그대로 썼다 —
       값을 베껴 적으면 나중에 매장 쪽만 고쳐졌을 때 따로 논다. 앱 반영 때 이름을 공용으로 정리할 것. -->
  <div class="stores-head mn-head">
    <p class="count-line stores-count"><span id="mnCountLabel">전골</span> <span class="count-num" id="mnCountNum">0</span>개</p>
    <p class="stores-note">메뉴는 매장 사정에 따라 달라질 수 있어요</p>
  </div>

  <div class="mn-bar">
    <div class="mn-tabs" id="mnTabs"></div>
  </div>

  <div class="mn-subs" id="mnSubs"></div>

  <div id="mnBody"></div>
</main>


<!-- 🔴 스티커 탭의 「기록하기」와 같은 모달이다 — 앱의 진짜 클래스(.stamp-sheet-overlay/.stamp-sheet)를
     그대로 써서 모양·여닫는 느낌이 어긋나지 않게 했다. 값을 베껴 적으면 나중에 따로 논다. -->
<div class="stamp-sheet-overlay" id="sheetDim">
  <div class="stamp-sheet" role="dialog" aria-modal="true" aria-label="담은 목록">
    <button class="stamp-sheet-close" id="sheetClose" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-linecap="round"><g transform="translate(12 12) scale(1.667) translate(-12 -12)"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.02"/></g></svg>
    </button>
    <div class="mn-sheet-head">
      <span class="mn-sheet-title">담은 목록</span>
      <button class="mn-sheet-clear" id="sheetClear" type="button">전체 지우기</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<nav class="tabbar">
  <button class="tabbar-btn" type="button"><span class="tabbar-label">레시피</span></button>
  <button class="tabbar-btn active" type="button"><span class="tabbar-label">메뉴</span></button>
  <button class="tabbar-btn" type="button"><span class="tabbar-label">매장</span></button>
  <button class="tabbar-btn" type="button"><span class="tabbar-label">스티커</span></button>
</nav>

<script src="menu-data.js"></script>
<script>
(function () {
  const D = window.MENU_DATA;
  // 🔴 화면 분류는 공식 2단이다(메뉴.md 「화면 분류」). 상위 = 전골·육류·야채류·디저트.
  //    D.tabs 의 7개 묶음은 자료 정리용이라 화면에 쓰지 않는다 — items 만 꺼내 쓴다.
  const ALL = D.tabs.flatMap(t => t.items);
  const TABS = [{ name: '전골', pot: true }].concat(
    D.cats.map(g => ({ name: g.up, subs: g.subs }))
  );
  const 하위메뉴 = (up, sub) => ALL.filter(it => it.up === up && it.sub === sub);
  let curSub = 0;
  const IMG = n => 'assets/menu/' + n + '.webp';
  // 냄비 칸은 타일(-타일)을 쓴다. 아직 안 들어온 육수는 카드용 그림을 임시로 쓴다(냄비 속 냄비로 보인다)
  const TILE = new Set(D.broths.filter(b => b.tile).map(b => b.n));
  const CELL_IMG = n => IMG(TILE.has(n) ? n + '-타일' : n);

  let cur = 0;                    // 지금 탭
  let cells = 2;                  // 냄비 칸 수(1·2·4)
  let broths = [];                // 고른 육수(칸 수만큼, 중복 허용)
  const picked = new Map();       // 담은 메뉴

  const $ = s => document.querySelector(s);

  function count() { return picked.size + (broths.length ? 1 : 0); }

  function renderSubs() {
    const t = TABS[cur];
    const el = $('#mnSubs');
    if (!t.subs) { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    el.innerHTML = t.subs.map((sub, i) =>
      `<button class="mn-sub ${i === curSub ? 'is-on' : ''}" data-sub="${i}">${sub}</button>`
    ).join('');
  }

  // 상위 탭 하나의 항목 수. 🔴 화면에 실제로 뜨는 것만 센다 — 하위 분류(subs)에 안 걸린 항목은
  //    화면에 나오지 않으므로 데이터 총계가 아니라 하위 분류를 훑어 더한다.
  //    하위 분류를 눌러도 숫자는 안 바뀐다(상위 카테고리 개수다).
  const 탭개수 = t => t.pot
    ? D.broths.length
    : t.subs.reduce((a, sub) => a + 하위메뉴(t.name, sub).length, 0);

  function renderHead() {
    const t = TABS[cur];
    $('#mnCountLabel').textContent = t.name;
    $('#mnCountNum').textContent = 탭개수(t);
  }

  function renderTabs() {
    $('#mnTabs').innerHTML = TABS.map((t, i) => {
      // 🔴 탭에 숫자를 넣지 않는다 — 고른 카드에 이미 ✓가 있어 같은 정보가 두 번 나온다
      return `<button class="mn-tab ${i === cur ? 'is-on' : ''}" data-i="${i}">${t.name}</button>`;
    }).join('');
  }

  const POTS = [1, 2, 4];
  // 「1 맛 / 2가지 맛」 대신 「1칸 / 2칸 / 4칸」으로 확정(2026-08-02 사용자). 미정이던 것 하나가 정해졌다.
  const potLabel = n => n + '칸';

  function renderPot() {
    return `
      <div class="mn-pot-seg">
        ${POTS.map(n => `<button data-pot="${n}" class="${n === cells ? 'is-on' : ''}">${potLabel(n)}</button>`).join('')}
      </div>

      <div class="mn-pot-wrap">
        <div class="mn-pot">
          <div class="mn-pot-inner" data-cells="${cells}">
            ${Array.from({ length: cells }, (_, i) => {
              const b = broths[i];
              return b
                ? `<div class="mn-cell is-filled" data-cell="${i}"><img src="${CELL_IMG(b)}" alt=""></div>`
                : `<div class="mn-cell"></div>`;
            }).join('')}
            ${cells > 1 ? `<div class="mn-pot-nums" data-cells="${cells}">
              ${Array.from({ length: cells }, (_, i) => `<span class="mn-pot-num">${i + 1}</span>`).join('')}
            </div>` : ''}
          </div>
        </div>
        <div class="mn-pot-side ${cells === 1 ? 'is-one' : ''}">
          ${Array.from({ length: cells }, (_, i) => {
            const b = broths[i];
            return `<div class="mn-pot-row ${b ? '' : 'is-empty'}"><b>${i + 1}</b><span>${b || '비어 있음'}</span>` +
                   (b ? `<button class="mn-row-x" data-cell="${i}" aria-label="빼기">✕</button>` : '') + `</div>`;
          }).join('')}
        </div>
      </div>
      <div class="mn-grid">
        ${D.broths.map(b => {
          // 🔴 담겨도 체크·빨간 테두리를 붙이지 않는다(2026-08-02 사용자 지시) —
          //    체크가 있으면 「이미 골랐으니 또 못 담는다」로 읽힌다. 중복해서 담을 수 있는 화면이다.
          //    담긴 것은 위 냄비가 보여준다. 줄에는 누르는 반응(press)만 준다.
          // 🔴 썸네일은 **냄비째 그린 카드용**이다(2026-08-02 사용자 확정).
          //    타일(국물만)로 바꿔봤더니 색 구분은 좋아졌지만 「냄비를 고르는 화면」이라는 게
          //    안 읽혔다 — 사용자가 바로 「냄비 어디갔냐」고 했다. 타일은 냄비 칸 안에서만 쓴다.
          return `<button class="mn-card mn-card--broth ${b.img ? '' : 'mn-card--text'}" data-broth="${b.n}">
            <div class="mn-card-thumb ${b.img ? '' : 'is-text'}">${
              b.img ? `<img src="${IMG(b.n)}" alt="">` : b.n}</div>
            <span class="mn-card-body">
              <span class="mn-card-name">${b.n}</span>
              ${b.jeju ? '<span class="mn-card-sub">제주 한정</span>' : ''}
            </span>
          </button>`;
        }).join('')}
      </div>`;
  }

  // 🔴 이름 규칙(2026-08-02 사용자 확정) — 화면에서만 나눈다. 데이터(메뉴.md)는 공식 이름 그대로 둔다.
  //    ① 끝 괄호는 부제로 내린다        차돌박이(지방 적음) → 차돌박이 / 지방 적음
  //    ② 앞의 「하이디라오」도 부제로     하이디라오 특제소고기 → 특제소고기 / 하이디라오
  //    이렇게 해야 320px 에서 이름이 안 잘린다(그림 80px 기준으로 재서 정함).
  function 이름나누기(n) {
    let 이름 = n, 부제 = '';
    const m = /^(.*?)\((.+)\)$/.exec(n);
    if (m) { 이름 = m[1].trim(); 부제 = m[2]; }
    if (/^하이디라오\s+/.test(이름)) {
      부제 = '하이디라오' + (부제 ? ' · ' + 부제 : '');
      이름 = 이름.replace(/^하이디라오\s+/, '');
    }
    return { 이름, 부제 };
  }

  // ── 그림 확대 모달 ────────────────────────────────────────
  function toggle(n) { picked.has(n) ? picked.delete(n) : picked.set(n, 1); }

  function openZoom(n) {
    const dim = document.createElement('div');
    dim.className = 'mn-zoom-dim'; dim.id = 'zoomDim';
    dim.innerHTML = `<div class="mn-zoom" data-menu="${n}">
      <button class="stamp-sheet-close" id="zoomClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-linecap="round"><g transform="translate(12 12) scale(1.667) translate(-12 -12)"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.02"/></g></svg>
      </button>
      <div class="mn-zoom-body"></div>
    </div>`;
    document.body.appendChild(dim);
    renderZoom();
  }
  function closeZoom() { $('#zoomDim')?.remove(); render(); }
  function renderZoom() {
    const box = $('.mn-zoom'); if (!box) return;
    const n = box.dataset.menu;
    const { 이름, 부제 } = 이름나누기(n);
    const on = picked.has(n);
    box.querySelector('.mn-zoom-body').innerHTML =
      `<img class="mn-zoom-img" src="${IMG(n)}" alt="">
       <span class="mn-zoom-name">${이름}</span>
       ${부제 ? `<span class="mn-zoom-sub">${부제}</span>` : ''}
       <button class="mn-zoom-add ${on ? 'is-on' : ''}" type="button">${on ? '담음 ✓' : '담기'}</button>`;
  }

  function renderGrid(t) {
    const items = 하위메뉴(t.name, t.subs[curSub]);
    return `<div class="mn-grid">${items.map(it => {
      const on = picked.has(it.n);
      const { 이름, 부제 } = 이름나누기(it.n);
      const 꼬리 = it.part ? (it.jeju ? '제주 한정' : '일부 매장') : '';
      const 아랫줄 = [부제, 꼬리].filter(Boolean).join(' · ');
      return `<button class="mn-card ${on ? 'is-on' : ''} ${it.img ? '' : 'mn-card--text'}" data-menu="${it.n}">
        <div class="mn-card-thumb ${it.img ? '' : 'is-text'}">${it.img ? `<img src="${IMG(it.n)}" alt="">` : 이름}</div>
        <span class="mn-card-body">
          <span class="mn-card-name">${이름}</span>
          ${아랫줄 ? `<span class="mn-card-sub">${아랫줄}</span>` : ''}
        </span>
        <span class="mn-card-check">✓</span>
      </button>`;
    }).join('')}</div>`;
  }

  // 🔴 번호 배지 색은 그 칸의 국물 색을 따라간다(실제 태블릿 화면과 같다).
  //    색을 손으로 적지 않고 타일 그림에서 뽑는다 — 타일이 바뀌면 색도 따라 바뀐다.
  //    1×1 캔버스에 줄여 그리면 그림 전체의 평균색이 나온다(같은 출처라 캔버스가 안 막힌다).
  function render() {
    renderTabs();
    renderHead();
    renderSubs();
    const t = TABS[cur];
    $('#mnBody').innerHTML = t.pot ? renderPot() : renderGrid(t);
    $('#potIcon').classList.toggle('has-item', !!count());
    window.scrollTo({ top: 0 });
  }

  function renderSheet() {
    const rows = [];
    if (broths.length) {
      rows.push(`<p class="mn-sheet-group">전골 ${potLabel(cells)}</p>`);
      broths.forEach((b, i) => rows.push(
        `<div class="mn-sheet-item">${b}<button class="mn-sheet-x" data-rm-broth="${i}">✕</button></div>`));
    }
    // 담은 목록도 화면 분류대로 묶는다 — 「육류 › 내장류」처럼 어디서 담았는지 그대로 보이게
    TABS.forEach(t => {
      if (t.pot) return;
      t.subs.forEach(sub => {
        const on = 하위메뉴(t.name, sub).filter(it => picked.has(it.n));
        if (!on.length) return;
        rows.push(`<p class="mn-sheet-group">${t.name} › ${sub}</p>`);
        on.forEach(it => rows.push(
          `<div class="mn-sheet-item">${it.n}<button class="mn-sheet-x" data-rm="${it.n}">✕</button></div>`));
      });
    });
    $('#sheetBody').innerHTML = rows.length ? rows.join('')
      : `<p class="mn-sheet-empty">아직 담은 것이 없어요</p>`;
  }

  document.addEventListener('click', e => {
    // 🔴 그림 클릭은 담기보다 먼저 본다 — 순서가 바뀌면 확대가 안 뜨고 담겨버린다
    const th = e.target.closest('.mn-card-thumb');
    if (th && th.querySelector('img') && th.closest('.mn-card[data-menu]')) {
      return openZoom(th.closest('.mn-card').dataset.menu);
    }
    if (e.target.closest('.mn-zoom-add')) { toggle($('.mn-zoom').dataset.menu); return renderZoom(); }
    if (e.target.closest('#zoomClose') || e.target.classList.contains('mn-zoom-dim')) return closeZoom();

    const tab = e.target.closest('.mn-tab');
    if (tab) { cur = +tab.dataset.i; curSub = 0; return render(); }   // 상위를 옮기면 하위는 처음으로

    const sub = e.target.closest('.mn-sub');
    if (sub) { curSub = +sub.dataset.sub; return render(); }

    const seg = e.target.closest('[data-pot]');
    if (seg) {
      cells = +seg.dataset.pot;
      if (broths.length > cells) broths = broths.slice(0, cells);   // 칸이 줄면 뒤에서 덜어낸다
      return render();
    }

    // 냄비 칸을 누르거나 오른쪽 목록의 ✕ 를 눌러 뺀다
    const cell = e.target.closest('[data-cell]');
    if (cell) {
      const i = +cell.dataset.cell;
      if (i < broths.length) { broths.splice(i, 1); return render(); }
      return;
    }

    // 🔴 육수는 중복해서 담을 수 있다 — 다시 눌러도 빠지지 않고 다음 칸에 또 들어간다.
    //    빼는 것은 냄비 칸을 눌러서 한다(위). 안 그러면 「2칸에 같은 육수」를 만들 방법이 없다.
    const bc = e.target.closest('[data-broth]');
    if (bc) {
      if (broths.length < cells) broths.push(bc.dataset.broth);
      return render();
    }

    const mc = e.target.closest('[data-menu]');
    if (mc) { toggle(mc.dataset.menu); return render(); }

    if (e.target.closest('#basketBtn')) {
      renderSheet();
      $('#sheetDim').classList.add('open');
      return;
    }
    // 어두운 배경이나 X 를 누르면 닫는다(시트 안쪽을 눌렀을 때는 안 닫힌다)
    if (e.target.closest('#sheetClose') || (e.target.id === 'sheetDim')) {
      $('#sheetDim').classList.remove('open');
      return;
    }
    if (e.target.closest('#sheetClear')) {
      picked.clear(); broths = []; renderSheet(); return render();
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) { picked.delete(rm.dataset.rm); renderSheet(); return render(); }
    const rmb = e.target.closest('[data-rm-broth]');
    if (rmb) { broths.splice(+rmb.dataset.rmBroth, 1); renderSheet(); return render(); }

  });

  render();



})();
</script>
</body>
</html>
