<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 탭 구상 — 하딜고고</title>
<!-- 🔴 목업이다. 앱 파일은 한 줄도 안 건드렸다.
     앱의 진짜 styles.css를 그대로 불러와 색·글꼴·카드 모양이 실제와 같게 했다. -->
<link rel="stylesheet" href="styles.css?v=635">
<style>
/* ── 목업 껍데기 (앱에 이미 있는 것은 안 적었다) ───────────────── */
body { background: var(--bg-card); }
.main { padding-bottom: 156px; }  /* 하단 고정 버튼(50) + 탭바 자리 */
.mk-note { max-width:440px; margin:0 auto; padding:10px 20px; font-size:12px; color:var(--text-muted); }

.topbar-inner { display:flex; align-items:center; justify-content:space-between; }
.mk-sec-title { font-size:15px; font-weight:700; color:var(--text-dark); }

/* ── 담은 목록 띠 (분류 탭보다 위, 늘 보임) ────────────────────── */
.mn-basket {
  position: sticky; top: 65px; z-index: 30;   /* 65 = 상단바 높이(실측) */
  display:flex; align-items:center; gap:8px;
  margin:0 -20px; padding:11px 20px;
  background:var(--bg-card); border-bottom:1px solid #EFE4D6;
  cursor:pointer; user-select:none;
}
.mn-basket-ic { font-size:16px; line-height:1; }
/* 🔴 숫자는 넣지 않는다(2026-08-02 사용자 확정). 비었는지만 진하기로 구분한다 */
.mn-basket-txt { font-size:14px; font-weight:700; color:var(--text-dark); }
.mn-basket-txt.is-empty { color:var(--text-muted); font-weight:600; }
.mn-basket-arrow { margin-left:auto; color:var(--text-muted); font-size:12px; }

/* ── 분류 탭 한 줄 (가로 스크롤) ───────────────────────────────── */
.mn-tabs {
  position:sticky; top:108px; z-index:29;      /* 65 + 담은목록 43(실측) */
  display:flex; gap:20px; overflow-x:auto; white-space:nowrap;
  margin:0 -20px; padding:12px 20px 10px;
  background:var(--bg-card); border-bottom:1px solid #EFE4D6;
}
.mn-tab {
  flex:none; background:none; border:0; padding:0 0 4px;
  font-size:15px; font-weight:600; color:var(--text-muted);
  font-family:inherit; cursor:pointer; position:relative;
}
.mn-tab.is-on { color:var(--text-dark); font-weight:800; }
.mn-tab.is-on::after {
  content:''; position:absolute; left:0; right:0; bottom:0;
  height:2px; border-radius:1px; background:var(--brand-red);
}
.mn-tab-dot {
  display:inline-block; min-width:16px; height:16px; margin-left:4px; padding:0 4px;
  border-radius:8px; background:var(--brand-red); color:#fff;
  font-size:10px; font-weight:800; line-height:16px; text-align:center; vertical-align:1px;
}

/* ── 전골: 냄비 (CSS로 그린다 — 그림 파일 안 씀) ────────────────── */
/* 칸 수는 화살표가 아니라 글씨를 눌러 고른다(2026-08-02 사용자 지시) */
.mn-pot-seg { display:flex; justify-content:center; gap:24px; padding:2px 0 12px; }
/* 🔴 알약(둥근 배경) 쓰지 않는다 — 앱의 탭과 같은 밑줄 방식으로 맞춘다 */
.mn-pot-seg button {
  border:0; background:none; font-family:inherit; position:relative;
  font-size:15px; font-weight:600; color:var(--text-muted);
  padding:0 0 5px; cursor:pointer;
}
.mn-pot-seg button.is-on { color:var(--text-dark); font-weight:800; }
.mn-pot-seg button.is-on::after {
  content:''; position:absolute; left:0; right:0; bottom:0;
  height:2px; border-radius:1px; background:var(--brand-red);
}
.mn-pot-wrap { display:flex; align-items:center; justify-content:center; padding:0 0 4px; }
/* 🔴 실제 하이디라오 태블릿 화면을 따랐다(2026-08-02 사용자 사진).
   흰 냄비 테 + 칸을 가르는 흰 선 + 가운데 모인 번호 배지. 칸마다 붙던 이름 띠는 뺐다. */
.mn-pot {
  width:206px; height:206px; border-radius:26px; padding:11px;
  background:#fff; border:1px solid #EBE3D7;
}
.mn-pot-inner {
  position:relative;
  width:100%; height:100%; border-radius:16px; overflow:hidden;
  display:grid; gap:2px; background:#fff;   /* 틈의 흰색이 그대로 구분선이 된다 */
}
/* 번호는 칸이 만나는 가운데에 모인다 */
.mn-pot-nums {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:grid; gap:2px; pointer-events:none;
}
.mn-pot-nums[data-cells="2"] { grid-template-columns:1fr 1fr; }
.mn-pot-nums[data-cells="4"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.mn-pot-num {
  width:27px; height:27px; border-radius:4px;
  background:#A8823C; color:#fff; font-size:14px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.mn-pot-inner[data-cells="1"] { grid-template-columns:1fr; grid-template-rows:1fr; }
.mn-pot-inner[data-cells="2"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr; }
.mn-pot-inner[data-cells="4"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.mn-cell {
  background:#DEDCCF; cursor:pointer;   /* 빈 칸 = 냄비 바닥 */
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  position:relative; font-size:11px; color:#B6A497; text-align:center; padding:4px;
}
.mn-cell img { width:100%; height:100%; object-fit:cover; }
/* 빼기 ✕ — 원 대신 모서리 그라데이션으로 대비를 만든다.
   타일이 들어오면 칸 배경이 제각각(검붉은 마라 ↔ 뽀얀 삼계탕)이라
   ✕만 얹으면 어느 한쪽에서 안 보인다. 손가락 자리는 32px로 넉넉히.
   🔴 그림자(filter)는 쓰지 않는다 — iOS 렌더가 제각각이라 이 프로젝트에서 금지다. */
.mn-cell-x {
  position:absolute; top:0; right:0; width:32px; height:32px;
  border:0; padding:0 4px 4px 0; color:#fff;
  background:radial-gradient(circle at top right, rgba(28,12,8,.62) 0%, rgba(28,12,8,.42) 52%, rgba(28,12,8,0) 78%);
  font-size:14px; font-weight:700; text-align:right; line-height:1;
  display:flex; align-items:flex-start; justify-content:flex-end;
  cursor:pointer; font-family:inherit;
}
.mn-cell-x span { padding:4px 5px 0 0; }
.mn-cell-name {
  position:absolute; left:0; right:0; bottom:0; padding:3px 4px;
  background:rgba(0,0,0,.5); color:#fff; font-size:10px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mn-pot-label { text-align:center; font-size:15px; font-weight:800; color:var(--text-dark); }
.mn-pot-list {
  display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px;
  padding:10px 0 2px; font-size:12.5px; color:var(--text-dark);
}
.mn-pot-list b {
  display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; margin-right:4px; border-radius:4px;
  background:#A8823C; color:#fff; font-size:11px; vertical-align:-3px;
}
.mn-pot-hint  { text-align:center; font-size:12.5px; color:var(--text-muted); margin:0 0 8px; }

/* ── 카드 2칸 ─────────────────────────────────────────────────── */
.mn-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 0 8px; }
.mn-card {
  position:relative; border:1px solid var(--card-border); border-radius:14px;
  background:#fff; overflow:hidden; cursor:pointer; text-align:left;
  padding:0; font-family:inherit; transition:border-color .15s, transform .1s;
}
.mn-card:active { transform:translateY(1px); }
/* 육수 카드는 담겨도 표시가 안 바뀌므로 누르는 반응이 유일한 신호다 — 조금 더 분명하게 */
.mn-card[data-broth]:active { border-color:var(--brand-red); transform:scale(.97); }
@media (hover:hover) { .mn-card[data-broth]:hover { border-color:var(--card-hover-border); } }
.mn-card.is-on { border-color:var(--brand-red); border-width:2px; }
.mn-card-thumb { aspect-ratio:1/1; background:#FBF4E6; display:flex; align-items:center; justify-content:center; }
.mn-card-thumb img { width:100%; height:100%; object-fit:contain; }
/* 그림 없는 카드 = 글자 카드. 🔴 이름을 두 번 쓰지 않는다 —
   썸네일 자리에 이름을 크게 넣고 아래 이름 줄은 지운다(높이는 grid가 맞춰준다) */
.mn-grid { align-items:stretch; }
.mn-card--text { display:flex; }
.mn-card-thumb.is-text {
  aspect-ratio:auto; flex:1; background:var(--bg-cream); padding:14px 10px;
  font-size:17px; font-weight:800; color:#7C6A60; text-align:center; line-height:1.35;
  word-break:keep-all;
}
.mn-card-name { display:block; padding:9px 10px 11px; font-size:13.5px; font-weight:700; color:var(--text-dark); word-break:keep-all; }
.mn-card-part {
  position:absolute; top:7px; left:7px; padding:2px 7px; border-radius:9px;
  background:rgba(255,255,255,.92); border:1px solid var(--card-border);
  font-size:10.5px; font-weight:700; color:#8A7468;
}
.mn-card-check {
  position:absolute; top:7px; right:7px; width:22px; height:22px; border-radius:50%;
  background:var(--brand-red); color:#fff; font-size:12px; font-weight:900;
  display:none; align-items:center; justify-content:center;
}
.mn-card.is-on .mn-card-check { display:flex; }
/* 글자 카드는 배지와 이름이 같은 자리라 겹친다 — 배지가 있을 때만 위를 비운다 */
.mn-card-thumb.is-text.has-part { padding-top:34px; }

.mn-notice { font-size:12px; color:var(--text-muted); line-height:1.6; padding:6px 0 4px; word-break:keep-all; }

/* ── 하단 고정 버튼 (탭바 위) ──────────────────────────────────── */
.mn-next-wrap {
  position:fixed; left:0; right:0; bottom:82px; z-index:40;
  display:flex; justify-content:center; padding:0 20px; pointer-events:none;
}
.mn-next {
  pointer-events:auto; width:100%; max-width:400px; height:50px; border:0; border-radius:25px;
  background:var(--brand-red); color:#fff; font-size:15.5px; font-weight:800;
  font-family:inherit; cursor:pointer; box-shadow:0 4px 14px rgba(224,48,30,.28);
}
.mn-next.is-skip { background:#fff; color:var(--text-dark); border:1px solid var(--card-border); box-shadow:0 4px 14px rgba(0,0,0,.06); }

/* ── 담은 목록 시트 ───────────────────────────────────────────── */
.mn-sheet-dim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; display:none; }
.mn-sheet-dim.is-on { display:block; }
.mn-sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:72vh;
  margin:0 auto; max-width:440px; background:var(--bg-card);
  border-radius:20px 20px 0 0; padding:14px 20px 34px; overflow-y:auto;
  transform:translateY(100%); transition:transform .22s ease;
}
.mn-sheet.is-on { transform:none; }
.mn-sheet-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.mn-sheet-title { font-size:16px; font-weight:800; color:var(--text-dark); }
.mn-sheet-clear { margin-left:auto; background:none; border:0; font-family:inherit; font-size:13px; color:var(--text-muted); text-decoration:underline; cursor:pointer; }
.mn-sheet-group { font-size:12.5px; font-weight:800; color:var(--text-muted); margin:12px 0 6px; }
.mn-sheet-item { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #EFE4D6; font-size:14px; color:var(--text-dark); }
.mn-sheet-x { margin-left:auto; background:none; border:0; color:var(--text-muted); font-size:15px; cursor:pointer; }
.mn-sheet-empty { padding:26px 0; text-align:center; font-size:14px; color:var(--text-muted); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="topbar-brand" type="button">
      <img class="topbar-logo-mark" src="assets/icons/logo-mark-color-v2.png?v=1" width="25" height="22" alt="">
      <span class="topbar-title">하딜고고</span>
    </button>
    <span class="mk-sec-title">메뉴</span>
  </div>
</header>

<main class="main">
  <div class="mn-basket" id="basketBar">
    <span class="mn-basket-ic">🧺</span>
    <span class="mn-basket-txt" id="basketTxt">담은 목록</span>
    <span class="mn-basket-arrow" id="basketArrow">▲</span>
  </div>

  <div class="mn-tabs" id="mnTabs"></div>
  <div id="mnBody"></div>

  <p class="mn-notice">메뉴 구성과 판매 여부는 지점 및 시기에 따라 달라질 수 있어요. 방문 전 이용할 지점의 공식 메뉴를 확인해 주세요.</p>
</main>

<div class="mn-next-wrap"><button class="mn-next" id="mnNext" type="button">다음</button></div>

<div class="mn-sheet-dim" id="sheetDim"></div>
<div class="mn-sheet" id="sheet">
  <div class="mn-sheet-head">
    <span class="mn-sheet-title">담은 목록</span>
    <button class="mn-sheet-clear" id="sheetClear" type="button">전체 지우기</button>
  </div>
  <div id="sheetBody"></div>
</div>

<nav class="tabbar">
  <button class="tabbar-btn" type="button"><span class="tabbar-label">레시피</span></button>
  <button class="tabbar-btn active" type="button"><span class="tabbar-label">메뉴</span></button>
  <button class="tabbar-btn" type="button"><span class="tabbar-label">매장</span></button>
  <button class="tabbar-btn" type="button"><span class="tabbar-label">스티커</span></button>
</nav>

<script src="_mockup-menu-data.js"></script>
<script>
(function () {
  const D = window.MENU_DATA;
  const TABS = [{ name: '전골', pot: true }].concat(D.tabs.map(t => ({ name: t.name, items: t.items })));
  const IMG = n => 'assets/menu/' + n + '.webp';
  // 냄비 칸은 타일(-타일)을 쓴다. 아직 안 들어온 육수는 카드용 그림을 임시로 쓴다(냄비 속 냄비로 보인다)
  const TILE = new Set(D.broths.filter(b => b.tile).map(b => b.n));
  const CELL_IMG = n => IMG(TILE.has(n) ? n + '-타일' : n);

  let cur = 0;                    // 지금 탭
  let cells = 2;                  // 냄비 칸 수(1·2·4)
  let broths = [];                // 고른 육수(칸 수만큼, 중복 허용)
  const picked = new Map();       // 담은 메뉴

  const $ = s => document.querySelector(s);

  function count() { return picked.size + (broths.length ? 1 : 0); }

  function renderTabs() {
    $('#mnTabs').innerHTML = TABS.map((t, i) => {
      // 🔴 탭에 숫자를 넣지 않는다 — 고른 카드에 이미 ✓가 있어 같은 정보가 두 번 나온다
      return `<button class="mn-tab ${i === cur ? 'is-on' : ''}" data-i="${i}">${t.name}</button>`;
    }).join('');
  }

  const POTS = [1, 2, 4];
  const potLabel = n => n === 1 ? '1 맛' : n + '가지 맛';

  function renderPot() {
    return `
      <div class="mn-pot-seg">
        ${POTS.map(n => `<button data-pot="${n}" class="${n === cells ? 'is-on' : ''}">${potLabel(n)}</button>`).join('')}
      </div>
      <p class="mn-pot-hint">${broths.length}/${cells}칸 · 같은 육수를 여러 칸에 넣어도 돼요</p>
      ${broths.length ? `<p class="mn-pot-list">${broths.map((b, i) => `<span><b>${i + 1}</b> ${b}</span>`).join('')}</p>` : ''}
      <div class="mn-pot-wrap">
        <div class="mn-pot">
          <div class="mn-pot-inner" data-cells="${cells}">
            ${Array.from({ length: cells }, (_, i) => {
              const b = broths[i];
              return b
                ? `<div class="mn-cell is-filled"><img src="${CELL_IMG(b)}" alt=""><button class="mn-cell-x" data-cell="${i}" aria-label="빼기"><span>✕</span></button></div>`
                : `<div class="mn-cell"></div>`;
            }).join('')}
            ${cells > 1 ? `<div class="mn-pot-nums" data-cells="${cells}">
              ${Array.from({ length: cells }, (_, i) => `<span class="mn-pot-num">${i + 1}</span>`).join('')}
            </div>` : ''}
          </div>
        </div>
      </div>
      <div class="mn-grid">
        ${D.broths.map(b => {
          // 🔴 담겨도 체크·빨간 테두리를 붙이지 않는다(2026-08-02 사용자 지시) —
          //    체크가 있으면 「이미 골랐으니 또 못 담는다」로 읽힌다. 중복해서 담을 수 있는 화면이다.
          //    담긴 것은 위 냄비가 보여준다. 카드에는 누르는 반응(hover/press)만 준다.
          return `<button class="mn-card ${b.img ? '' : 'mn-card--text'}" data-broth="${b.n}">
            ${b.jeju ? '<span class="mn-card-part">제주 한정</span>' : ''}
            <div class="mn-card-thumb ${b.img ? '' : 'is-text'} ${!b.img && b.jeju ? 'has-part' : ''}">${b.img ? `<img src="${IMG(b.n)}" alt="">` : b.n}</div>
            ${b.img ? `<span class="mn-card-name">${b.n}</span>` : ''}
          </button>`;
        }).join('')}
      </div>`;
  }

  function renderGrid(t) {
    return `<div class="mn-grid">${t.items.map(it => {
      const on = picked.has(it.n);
      return `<button class="mn-card ${on ? 'is-on' : ''} ${it.img ? '' : 'mn-card--text'}" data-menu="${it.n}">
        <span class="mn-card-check">✓</span>
        ${it.part ? `<span class="mn-card-part">${it.jeju ? '제주 한정' : '일부 매장'}</span>` : ''}
        <div class="mn-card-thumb ${it.img ? '' : 'is-text'} ${!it.img && it.part ? 'has-part' : ''}">${it.img ? `<img src="${IMG(it.n)}" alt="">` : it.n}</div>
        ${it.img ? `<span class="mn-card-name">${it.n}</span>` : ''}
      </button>`;
    }).join('')}</div>`;
  }

  // 🔴 「건너뛰기」는 없앴다(2026-08-02 사용자 지시) — 분류 탭이 위에 늘 있어
  //    건너뛸 방법이 이미 있다. 아무것도 안 골랐으면 버튼 자체를 안 보여준다.
  function renderNext() {
    const t = TABS[cur];
    const has = t.pot ? broths.length > 0 : t.items.some(it => picked.has(it.n));
    const btn = $('#mnNext');
    const nx = TABS[cur + 1];
    $('.mn-next-wrap').style.display = has ? '' : 'none';
    btn.textContent = nx ? `다음 · ${nx.name} →` : '담은 목록 보기';
    btn.classList.remove('is-skip');
  }

  // 🔴 번호 배지 색은 그 칸의 국물 색을 따라간다(실제 태블릿 화면과 같다).
  //    색을 손으로 적지 않고 타일 그림에서 뽑는다 — 타일이 바뀌면 색도 따라 바뀐다.
  //    1×1 캔버스에 줄여 그리면 그림 전체의 평균색이 나온다(같은 출처라 캔버스가 안 막힌다).
  const tintCache = new Map();
  function tintNums() {
    document.querySelectorAll('.mn-pot-num').forEach((el, i) => {
      const b = broths[i];
      if (!b) return;                       // 빈 칸은 기본 금색 그대로
      const src = CELL_IMG(b);
      const put = c => { el.style.background = c; };
      if (tintCache.has(src)) return put(tintCache.get(src));
      const im = new Image();
      im.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = 1;
        const g = cv.getContext('2d');
        g.drawImage(im, 0, 0, 1, 1);
        const [r, gr, bl] = g.getImageData(0, 0, 1, 1).data;
        // 흰 글씨가 읽히도록 조금 어둡게 눌러 준다
        const c = `rgb(${Math.round(r * .82)},${Math.round(gr * .82)},${Math.round(bl * .82)})`;
        tintCache.set(src, c); put(c);
      };
      im.src = src;
    });
  }

  function render() {
    renderTabs();
    const t = TABS[cur];
    $('#mnBody').innerHTML = t.pot ? renderPot() : renderGrid(t);
    $('#basketTxt').classList.toggle('is-empty', !count());
    renderNext();
    if (t.pot) tintNums();
    window.scrollTo({ top: 0 });
  }

  function renderSheet() {
    const rows = [];
    if (broths.length) {
      rows.push(`<p class="mn-sheet-group">전골 ${cells === 1 ? '1 맛' : cells + '가지 맛'}</p>`);
      broths.forEach((b, i) => rows.push(
        `<div class="mn-sheet-item">${b}<button class="mn-sheet-x" data-rm-broth="${i}">✕</button></div>`));
    }
    TABS.forEach(t => {
      if (t.pot) return;
      const on = t.items.filter(it => picked.has(it.n));
      if (!on.length) return;
      rows.push(`<p class="mn-sheet-group">${t.name}</p>`);
      on.forEach(it => rows.push(
        `<div class="mn-sheet-item">${it.n}<button class="mn-sheet-x" data-rm="${it.n}">✕</button></div>`));
    });
    $('#sheetBody').innerHTML = rows.length ? rows.join('')
      : `<p class="mn-sheet-empty">아직 담은 것이 없어요</p>`;
  }

  document.addEventListener('click', e => {
    const tab = e.target.closest('.mn-tab');
    if (tab) { cur = +tab.dataset.i; return render(); }

    const seg = e.target.closest('[data-pot]');
    if (seg) {
      cells = +seg.dataset.pot;
      if (broths.length > cells) broths = broths.slice(0, cells);   // 칸이 줄면 뒤에서 덜어낸다
      return render();
    }

    // 칸 안의 ✕ 를 눌러 뺀다. 칸 아무 데나 눌러 빠지면 실수로 지워진다
    const cell = e.target.closest('[data-cell]');
    if (cell) {
      const i = +cell.dataset.cell;
      if (i < broths.length) { broths.splice(i, 1); return render(); }
      return;
    }

    // 🔴 육수는 중복해서 담을 수 있다 — 다시 눌러도 빠지지 않고 다음 칸에 또 들어간다.
    //    빼는 것은 냄비 칸을 눌러서 한다(위). 안 그러면 「2칸에 같은 육수」를 만들 방법이 없다.
    const bc = e.target.closest('[data-broth]');
    if (bc) {
      if (broths.length < cells) broths.push(bc.dataset.broth);
      return render();
    }

    const mc = e.target.closest('[data-menu]');
    if (mc) {
      const n = mc.dataset.menu;
      picked.has(n) ? picked.delete(n) : picked.set(n, 1);
      return render();
    }

    if (e.target.closest('#basketBar')) {
      renderSheet();
      $('#sheet').classList.add('is-on');
      $('#sheetDim').classList.add('is-on');
      return;
    }
    if (e.target.closest('#sheetDim')) {
      $('#sheet').classList.remove('is-on');
      $('#sheetDim').classList.remove('is-on');
      return;
    }
    if (e.target.closest('#sheetClear')) {
      picked.clear(); broths = []; renderSheet(); return render();
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) { picked.delete(rm.dataset.rm); renderSheet(); return render(); }
    const rmb = e.target.closest('[data-rm-broth]');
    if (rmb) { broths.splice(+rmb.dataset.rmBroth, 1); renderSheet(); return render(); }

    if (e.target.closest('#mnNext')) {
      if (cur < TABS.length - 1) { cur++; return render(); }
      renderSheet();
      $('#sheet').classList.add('is-on');
      $('#sheetDim').classList.add('is-on');
    }
  });

  render();
})();
</script>
</body>
</html>
