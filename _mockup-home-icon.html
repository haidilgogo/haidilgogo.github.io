<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈 아이콘 후보 — 하딜고고</title>
<link rel="stylesheet" href="styles.css?v=644">
<style>
  /* 목업 전용 — 하단바를 화면에 고정하지 않고 그 자리에서 보여준다 */
  body { padding: 20px 12px 60px; background: var(--bg, #FBF7F2); }
  .mk-title { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:18px; font-weight:800; color:#4D4139; margin:0 0 4px; }
  .mk-lead { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:13px; color:#8A7468; margin:0 0 24px; line-height:1.6; }
  .mk-case { margin:0 0 28px; }
  .mk-name { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:14px; font-weight:800; color:#4D4139; margin:0 0 2px; }
  .mk-desc { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:12px; color:#8A7468; margin:0 0 10px; }
  .mk-frame { border:1px dashed #E2D6CC; border-radius:12px; padding:10px 0; background:#fff; }
  .mk-frame[data-w="320"] { width:320px; }
  .mk-frame[data-w="393"] { width:393px; max-width:100%; }
  .mk-wnote { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:11px; color:#B3A79E; margin:6px 0 0; }
  /* 하단바를 목업 안에서 그대로 보이게 */
  /* 🔴 relative 여야 한다 — 활성 표시(.tabbar-indicator)가 absolute 라 static 이면 body 기준으로 날아간다 */
  .mk-frame .tabbar { position:relative; transform:none; margin:0 auto; }
  /* 393px 은 지금 값(min-width 62 · 좌우 여백 12) 그대로 다섯 개가 들어간다.
     320px 에서만 버튼을 좁힌다 — min-width 62 → 52, 좌우 여백 12 → 8 */
  .mk-frame[data-w="320"] .tabbar-btn { min-width:52px; padding:4px 8px; }
  /* 활성 표시(로즈 필) — 앱에서는 JS가 움직이지만 목업이라 그 자리에 고정으로 그린다 */
  .mk-frame .tabbar-indicator { transition:none; }
  .mk-big { display:flex; gap:22px; align-items:center; flex-wrap:wrap; padding:14px 12px; background:#fff; border:1px dashed #E2D6CC; border-radius:12px; margin:0 0 28px; }
  .mk-big figure { margin:0; text-align:center; color:#4D4139; }
  .mk-big figcaption { font-family:'Pretendard Variable',Pretendard,sans-serif; font-size:11px; color:#8A7468; margin-top:6px; }
</style>
</head>
<body>

<h1 class="mk-title">홈 아이콘 후보</h1>
<p class="mk-lead">
  다섯 후보를 <b>실제 하단바</b>에 넣어 봤습니다. 아래는 393px(사용자님 폰) 기준이고,
  맨 끝에 320px(가장 좁은 폰)도 하나 있습니다.<br>
  나머지 넷(레시피·메뉴·매장·스티커)은 지금 앱에 있는 그대로입니다.
</p>

<div class="mk-big" id="bigRow"></div>

<div id="cases"></div>

<script>
// 지금 앱에 있는 네 아이콘 (index.html 에서 그대로 가져옴)
const ICON_RECIPE = `<svg class="tabbar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
  <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 18.5v-14z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M5 17.5A1.5 1.5 0 0 1 6.5 16H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 7.5h6M9 10.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const ICON_MENU = `<svg class="tabbar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(12 12) scale(1.08) translate(-12 -12)">
    <path d="M8 3.5c-1.7 0-3 1.7-3 3.8 0 1.9 1.3 3.3 3 3.3s3-1.4 3-3.3c0-2.1-1.3-3.8-3-3.8ZM8 10.6v9.9"/>
    <path d="M14.5 3.5 13.6 20.5M18 3.5 17.4 20.5"/></g></svg>`;
const ICON_STORE = `<svg class="tabbar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
  <g transform="translate(12 12) scale(1.045) translate(-12 -12)">
  <path fill-rule="evenodd" clip-rule="evenodd" d="M4.87617 3.75H19.1238L21 8.86683V10.5C21 11.2516 20.7177 11.9465 20.25 12.4667V21H3.75V12.4667C3.28234 11.9465 3 11.2516 3 10.5V8.86683L4.87617 3.75ZM18.1875 13.3929C18.3807 13.3929 18.5688 13.3731 18.75 13.3355V19.5H15V15H9L9 19.5H5.25V13.3355C5.43122 13.3731 5.61926 13.3929 5.8125 13.3929C6.63629 13.3929 7.36559 13.0334 7.875 12.4667C8.38441 13.0334 9.11371 13.3929 9.9375 13.3929C10.7613 13.3929 11.4906 13.0334 12 12.4667C12.5094 13.0334 13.2387 13.3929 14.0625 13.3929C14.8863 13.3929 15.6156 13.0334 16.125 12.4667C16.6344 13.0334 17.3637 13.3929 18.1875 13.3929ZM10.5 19.5H13.5V16.5H10.5L10.5 19.5ZM19.5 9.75V10.5C19.5 11.2965 18.8856 11.8929 18.1875 11.8929C17.4894 11.8929 16.875 11.2965 16.875 10.5V9.75H19.5ZM19.1762 8.25L18.0762 5.25H5.92383L4.82383 8.25H19.1762ZM4.5 9.75V10.5C4.5 11.2965 5.11439 11.8929 5.8125 11.8929C6.51061 11.8929 7.125 11.2965 7.125 10.5V9.75H4.5ZM8.625 9.75V10.5C8.625 11.2965 9.23939 11.8929 9.9375 11.8929C10.6356 11.8929 11.25 11.2965 11.25 10.5V9.75H8.625ZM12.75 9.75V10.5C12.75 11.2965 13.3644 11.8929 14.0625 11.8929C14.7606 11.8929 15.375 11.2965 15.375 10.5V9.75H12.75Z" fill="currentColor"/></g></svg>`;
const ICON_STAMP = `<svg class="tabbar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(12 12) scale(0.90) translate(-12 -12)">
    <path d="M2 12C2 17.5228 6.47715 22 12 22C12.6477 22 13.2503 21.7004 13.7083 21.2424L21.2424 13.7083C21.7004 13.2503 22 12.6477 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12Z"/>
    <path d="M8.9126 15.9336C9.94668 16.1928 11.0951 16.2391 12.2688 16.0337"/>
    <ellipse cx="14.5094" cy="9.77405" rx="1" ry="1.5" transform="rotate(-15 14.5094 9.77405)" fill="currentColor" stroke="none"/>
    <ellipse cx="8.71402" cy="11.3278" rx="1" ry="1.5" transform="rotate(-15 8.71402 11.3278)" fill="currentColor" stroke="none"/>
    <path d="M12 22C12 19.2071 12 17.8107 12.3928 16.688C13.0964 14.6773 14.6773 13.0964 16.688 12.3928C17.8107 12 19.2071 12 22 12"/></g></svg>`;

// 홈 후보 다섯 — 전부 선(line) 아이콘, 굵기 1.7 로 통일(상단바 아이콘군과 같은 값)
const S = 'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const HOMES = [
  { key:'A', name:'가 · 기본 집', desc:'지붕 + 몸통. 문 없이 가장 단순합니다.',
    svg:`<path d="M3.2 10.8 12 3.8l8.8 7" ${S}/><path d="M5.6 9.4V20.2h12.8V9.4" ${S}/>` },
  { key:'B', name:'나 · 문 있는 집', desc:'가장 흔한 형태. 문이 있어 「집」으로 바로 읽힙니다.',
    svg:`<path d="M3.2 10.8 12 3.8l8.8 7" ${S}/><path d="M5.6 9.4V20.2h12.8V9.4" ${S}/><path d="M9.8 20.2v-5.2h4.4v5.2" ${S}/>` },
  { key:'C', name:'다 · 둥근 집', desc:'몸통 아래 모서리를 둥글렸습니다. 앱의 둥근 카드·탭바와 결이 맞습니다.',
    svg:`<path d="M3.2 10.8 12 3.8l8.8 7" ${S}/><path d="M5.6 9.4v8.6a2.2 2.2 0 0 0 2.2 2.2h8.4a2.2 2.2 0 0 0 2.2-2.2V9.4" ${S}/>` },
  { key:'D', name:'라 · 지붕이 넓은 집', desc:'지붕을 처마처럼 넓게. 낮고 안정적으로 보입니다.',
    svg:`<path d="M2.4 11.2 12 3.6l9.6 7.6" ${S}/><path d="M6 10.2V20.2h12V10.2" ${S}/><path d="M9.8 20.2v-4.8h4.4v4.8" ${S}/>` },
  { key:'E', name:'마 · 창문 집', desc:'문 대신 창을 넣었습니다. 문 있는 집보다 조금 아기자기합니다.',
    svg:`<path d="M3.2 10.8 12 3.8l8.8 7" ${S}/><path d="M5.6 9.4V20.2h12.8V9.4" ${S}/><path d="M10 12.6h4v4h-4z" ${S}/>` },
  { key:'F', name:'바 · 로고 4분할 (참고)', desc:'상단바 로고와 같은 모양이라 화면에 같은 것이 두 번 나옵니다. 참고용입니다.',
    svg:`<path d="M4.5 4.5h6.2v6.2H4.5zM13.3 4.5h6.2v6.2h-6.2zM4.5 13.3h6.2v6.2H4.5zM13.3 13.3h6.2v6.2h-6.2z" ${S}/>` },
];

const homeSvg = (h) => `<svg class="tabbar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">${h.svg}</svg>`;

// 큰 미리보기 줄
document.getElementById('bigRow').innerHTML = HOMES.map((h) =>
  `<figure><svg width="44" height="44" viewBox="0 0 24 24" fill="none">${h.svg}</svg>
   <figcaption>${h.key}</figcaption></figure>`).join('');

// 하단바 한 벌 만들기
function bar(h, activeHome) {
  const btn = (icon, label, on) =>
    `<button class="tabbar-btn${on ? ' active' : ''}" type="button">${icon}<span class="tabbar-label">${label}</span></button>`;
  return `<nav class="tabbar" aria-hidden="true">
    <span class="tabbar-indicator"></span>
    ${btn(homeSvg(h), '홈', activeHome)}
    ${btn(ICON_RECIPE, '레시피', !activeHome)}
    ${btn(ICON_MENU, '메뉴', false)}
    ${btn(ICON_STORE, '매장', false)}
    ${btn(ICON_STAMP, '스티커', false)}
  </nav>`;
}

document.getElementById('cases').innerHTML = HOMES.map((h) => `
  <section class="mk-case">
    <p class="mk-name">${h.name}</p>
    <p class="mk-desc">${h.desc}</p>
    <div class="mk-frame mk-five" data-w="393">${bar(h, true)}</div>
    <p class="mk-wnote">↑ 393px · 홈이 켜진 상태</p>
    <div class="mk-frame mk-five" data-w="393">${bar(h, false)}</div>
    <p class="mk-wnote">↑ 393px · 레시피가 켜진 상태(홈은 꺼진 색)</p>
  </section>
`).join('') + `
  <section class="mk-case">
    <p class="mk-name">320px — 가장 좁은 폰에서 다섯 개</p>
    <p class="mk-desc">버튼 좌우 여백을 12 → 8px 로 줄인 상태입니다. 「레시피」·「스티커」가 한 줄에 들어갑니다.</p>
    ${HOMES.slice(0, 2).map((h) => `<div class="mk-frame mk-five" data-w="320">${bar(h, true)}</div>
      <p class="mk-wnote">↑ ${h.key}</p>`).join('')}
  </section>`;

// 활성 버튼 자리에 로즈 필을 그린다(앱의 slideIndicator 가 하는 일을 정지 상태로)
document.querySelectorAll('.mk-frame .tabbar').forEach((nav) => {
  const on = nav.querySelector('.tabbar-btn.active');
  const ind = nav.querySelector('.tabbar-indicator');
  if (!on || !ind) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.height = on.offsetHeight + 'px';
  ind.style.transform = 'translate(' + on.offsetLeft + 'px,' + on.offsetTop + 'px)';
});
</script>
</body>
</html>
