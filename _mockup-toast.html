<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스트 자리 시험판 — 하딜고고</title>
<link rel="stylesheet" href="styles.css?v=754">
<style>
/* ===== 시험판 전용 (앱 파일은 안 건드린다) =====
   🔴 앱의 .share-toast 는 display:none ↔ block 이라 서서히 사라지는 게 안 걸린다.
      여기서는 opacity + visibility 로 바꿔 본다.
      visibility 를 같이 거는 이유 = 투명도만 0 으로 두면 닫힌 요소가 화면을 차지한 채 남아
      사파리 주소창이 불투명해지던 전례가 있다(2026-08-05 해결). */
.share-toast {
  display: block;              /* 앱의 display:none 을 덮는다 */
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--out, 0s) linear, visibility 0s linear var(--out, 0s);
}
.share-toast.show {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--in, 0s) linear, visibility 0s;
}
/* 자리 — 위 */
.share-toast.at-top { top: var(--toastTop, 85px); bottom: auto; }

/* 인앱 배너 흉내 */
#fakeBanner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  background: #2B120D; color: #fff; font-size: 12.5px; text-align: center;
  padding: 11px 14px; font-family: Pretendard, sans-serif;
}
body.has-banner #fakeBanner { display: block; }

/* 조작판 */
#panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 400;
  background: #fff; border-top: 2px solid #2B120D;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  font-family: Pretendard, sans-serif; font-size: 13px;
  max-height: 52vh; overflow-y: auto;
}
#panel h4 { margin: 10px 0 6px; font-size: 12px; color: #8A6A5F; font-weight: 700; }
#panel h4:first-child { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.row button {
  flex: 1 1 auto; min-width: 64px; padding: 9px 6px; border-radius: 9px;
  border: 1.5px solid #E4D9CE; background: #FCF9F5; font-size: 12.5px;
  font-weight: 600; color: #2B120D; font-family: inherit;
}
.row button.on { background: #D0402E; border-color: #D0402E; color: #fff; }
#fire {
  width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 11px;
  background: #2B120D; color: #fff; font-size: 15px; font-weight: 700; font-family: inherit;
}
#now { margin-top: 9px; font-size: 12px; color: #8A6A5F; text-align: center; line-height: 1.5; }
/* 조작판이 화면을 먹으니 탭바를 그 위로 */
.tabbar { bottom: calc(52vh + 12px); }
.filler { padding: 20px 16px; font-size: 14px; color: #8A6A5F; line-height: 1.9; }
</style>
</head>
<body>

<div id="fakeBanner">홈 화면에 추가해서 앱처럼 사용하려면 Safari로 열어주세요</div>

<header class="topbar">
    <div class="topbar-inner">
      <button class="topbar-brand" id="homeBtn" type="button">
        <img class="topbar-logo-mark" src="assets/icons/logo-mark-color-v2.png?v=1" width="25" height="22" draggable="false" alt="">
        <span class="topbar-title">하딜고고</span>
      </button>
      <!-- 🔴 레시피 카테고리 탭은 상단바에 있다(2026-08-03 사용자 확정) — 상단바가 붙박이(sticky)라
           카드를 한참 내려도 카테고리가 늘 손에 닿는다. 로고는 홈 탭에만 보인다.
           8/2에 탭줄을 붙박이로 만들려다 되돌린 적이 있는데(카드가 탭 밑으로 파고드는 걸 가릴 선이
           필요했다), 상단바 안으로 들어오면 이미 있는 상단바 구분선이 그 일을 한다. -->
      <!-- 🔴 가로 스크롤 껍데기(.tabs-scroll)를 따로 두지 않는다(2026-08-04) —
           `.tabs` 자체가 이미 overflow-x: auto 다(styles.css 의 @media all 블록). 감싸면 빈 스크롤 상자가
           하나 더 생길 뿐이다. 탭이 늘어도 상단바가 안 깨지게 하는 건 `.topbar-cat` 의 flex 값이다. -->
      <div class="topbar-cat topbar-cat--recipe">
        <div class="tabs browse-cat-tabs" id="browseCatTabs">
          <span class="tabs-underline" id="browseCatUnderline"></span>
        </div>
      </div>
      <!-- 메뉴 탭 상위 분류 — 레시피와 같은 자리, 같은 부품 -->
      <div class="topbar-cat topbar-cat--menu">
        <!-- 🔴 전골은 **스크롤 영역 밖**에 둔다(2026-08-05 사용자 확정). 처음엔 탭줄 안에서
             position:sticky 로 붙여 뒀는데, 왼쪽 끝에서 튕길 때 **전골이 같이 딸려갔다**(실기기 확인).
             붙박이는 「스크롤 영역 왼쪽 끝보다 왼쪽으로는 안 간다」만 지킬 뿐, 영역이 통째로
             튕기는 것은 못 막는다. 아예 밖에 두면 구조적으로 못 움직인다.
             ⚠️ 왼쪽 끝 튕김 자체를 끄는 방법(overscroll-behavior-x)은 **양쪽에 다 걸려서**
                오른쪽 끝 튕김까지 없어진다. 이 사이트는 스크롤바를 전역으로 껐기 때문에
                「뒤에 더 있다」는 신호가 그 튕김뿐이다 — 그래서 안 쓴다. -->
        <div class="mn-tabs-row">
          <div class="mn-tabs-pin" id="mnPotTab"></div>
          <!-- 🔴 밑줄(span)은 마크업에 둔다 — 레시피와 같은 방식. JS 가 매번 새로 만들면
               옛 위치를 잃어버려 미끄러지지 못하고 0 에서 다시 그려진다(2026-08-03 실기기 영상으로 발견). -->
          <div class="tabs" id="mnTabs"><span class="tabs-underline" id="mnTabsUnderline"></span></div>
        </div>
      </div>
      <!-- 매장 지역 탭 — 레시피·메뉴와 같은 자리, 같은 부품(2026-08-04).
           2026-07-23에 상단바 아래로 내렸던 것을 도로 올린 것이다. 그때는 세 탭이 제각각이었지만
           8/3에 레시피·메뉴 탭이 상단바로 올라가면서 매장만 아래에 남아 혼자 달랐다.
           🔴 감싸개(.tabs-scroll)를 두지 않는다 — `.tabs` 자체가 이미 overflow-x: auto 다. -->
      <div class="topbar-cat topbar-cat--store">
        <div class="tabs" id="storeTabs"><span class="tabs-underline" id="storeTabsUnderline"></span></div>
      </div>
      <!-- 스티커 지역 탭 — 매장과 같은 부품·같은 자리(2026-08-04 사용자 지시).
           🔴 2026-07-24 에 「스티커에 지역 탭 안 씀」으로 지웠던 것을 되살린 것이다.
              그때 지운 코드(activeStampRegion·renderStampTabs·밑줄 계산)를 매장 것을 본떠 다시 만들었다.
           🔴 탭은 **다녀온 지역만** 나온다(매장은 항상 6개 고정). 스티커는 내 기록이라
              안 가본 지역 탭을 눌러 빈 화면을 보는 게 의미가 없다. 기록이 없으면 탭 줄 자체가 안 뜬다. -->
      <div class="topbar-cat topbar-cat--stamp">
        <div class="tabs" id="stampTabs"><span class="tabs-underline" id="stampTabsUnderline"></span></div>
      </div>
      <!-- 카테고리 필터 탭 제거(2026-07-21 홈 7단 개편) — 카테고리는 홈 섹션으로 이동.
           즐겨찾기 버튼은 topbar-right로 이사, 이 그룹은 숨김(favShareBtn 등은 script 참조 때문에 DOM 유지) -->
      <div class="tabs-group tabs-group--recipe">
        <button class="tabs-share-btn" id="favShareBtn" type="button" aria-label="친구에게 공유">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="tabs-share-btn tabs-install-btn" type="button" aria-label="앱 설치하기" style="display:none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 11l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 18v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <!-- 매장 섹션의 공유·설치 버튼 자리(숨김). 지역 탭 자체는 위 .topbar-cat--store 로 올라갔다(2026-08-04).
           ⚠️ 옛 주석에 「지역 탭은 상단바 아래로 이동함(2026-07-23)」이라고 적혀 있었는데 지금은 사실이 아니다. -->
      <div class="tabs-group tabs-group--store" id="storeTabsGroup">
        <button class="tabs-share-btn" id="storeShareBtn" type="button" aria-label="친구에게 공유">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="tabs-share-btn tabs-install-btn" type="button" aria-label="앱 설치하기" style="display:none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 11l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 18v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="topbar-spacer"></div>
      <!-- 상단 우측 그룹: 즐겨찾기 + 공유 + 설치. 검색창은 2026-07-25부터 개수 옆(list-head)으로 이동, 상시 노출 -->
      <div class="topbar-right">
      <!-- 즐겨찾기(레시피 섹션 전용) -->
      <button class="fav-toggle-btn" id="favToggleBtn" type="button" aria-label="즐겨찾기" aria-pressed="false">
        <svg class="fav-toggle-icon" id="favToggleIcon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <!-- 북마크 글리프가 viewBox를 덜 채워 X·공유 아이콘보다 작아 보임 → 중앙 기준 1.111배 확대,
               확대분만큼 stroke-width를 1.7→1.53으로 보정(2026-07-25, 아이콘 18px 통일) -->
          <g transform="translate(12 12) scale(1.111) translate(-12 -12)">
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.53" stroke-linejoin="round"/>
          </g>
        </svg>
        <span class="fav-toggle-label">즐겨찾기</span>
      </button>
      <!-- 내 메뉴(메뉴 섹션 전용) — 훠궈 냄비. 세 겹으로 상태를 만든다:
           비었을 때=선만 / 담겼을 때=선+김(김만 빨강) / 눌렀을 때=채움(빨강).
           아이콘 출처 Flaticon · Magnific → credits.html 에 표기할 것 -->
      <button class="topbar-icon-btn pot-btn" id="potToggleBtn" type="button" aria-label="내 메뉴">

    <button data-out="0">A · 툭 (지금)</button>
    <button data-out="0.15">B · 0.15초</button>

    <button data-out="0.8">E · 0.8초</button>
  </div>

  <h4>③ 인앱 배너 (카톡으로 열었을 때)</h4>
  <div class="row" id="banRow">
    <button data-ban="0">없음</button>
    <button data-ban="1">배너 있음</button>
  </div>

  <button id="fire">토스트 띄우기</button>
  <div id="now"></div>
</div>

<script>
(function () {
  var toast = document.getElementById('toast');
  var body  = document.body;
  var state = { pos: '85', out: '0.3', ban: '0' };
  var timer = null;

  // 탭바 표시등을 첫 탭 자리에 (앱은 JS가 놓는다 — 없으면 탭바가 실제와 달라 보인다)
  var ind = document.getElementById('tabbarIndicator');
  var first = document.querySelector('.tabbar-btn');
  if (ind && first) {
    var b = first.getBoundingClientRect(), p = first.parentElement.getBoundingClientRect();
    ind.style.left = (b.left - p.left) + 'px';
    ind.style.width = b.width + 'px';
  }

  function paint() {
    [['posRow','pos'],['outRow','out'],['banRow','ban']].forEach(function (pair) {
      var row = document.getElementById(pair[0]);
      [].forEach.call(row.children, function (btn) {
        var v = btn.dataset.pos || btn.dataset.out || btn.dataset.ban;
        btn.classList.toggle('on', v === state[pair[1]]);
      });
    });

    if (state.pos === 'bottom') {
      toast.classList.remove('at-top');
    } else {
      toast.classList.add('at-top');
      var top = parseInt(state.pos, 10);
      if (state.ban === '1') top += document.getElementById('fakeBanner').offsetHeight;
      toast.style.setProperty('--toastTop', top + 'px');
    }
    toast.style.setProperty('--out', state.out + 's');
    toast.style.setProperty('--in', '0s');   // 뜨는 건 언제나 즉시
    body.classList.toggle('has-banner', state.ban === '1');
    body.style.paddingTop = state.ban === '1'
      ? document.getElementById('fakeBanner').offsetHeight + 'px' : '';

    document.getElementById('now').textContent =
      '자리 ' + (state.pos === 'bottom' ? '지금(아래 90)' : '위 ' + state.pos) +
      ' · 사라지기 ' + (state.out === '0' ? '툭' : state.out + '초') +
      (state.ban === '1' ? ' · 배너 있음' : '');
  }

  document.getElementById('panel').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.pos) state.pos = b.dataset.pos;
    else if (b.dataset.out) state.out = b.dataset.out;
    else if (b.dataset.ban) state.ban = b.dataset.ban;
    else return;
    paint();
  });

  document.getElementById('fire').addEventListener('click', function () {
    clearTimeout(timer);
    toast.classList.remove('show');
    // 한 프레임 쉬어야 다시 「확」 뜬다
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        toast.classList.add('show');
        timer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
      });
    });
  });

  paint();
})();
</script>
