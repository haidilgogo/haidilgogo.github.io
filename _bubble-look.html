<!DOCTYPE html>
<html lang="ko" data-v="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCF9F5">
<title>방울 왜곡·색수차 — 멈춘 그림</title>
<style>
  /* 🔴 이 목업은 일부러 "멈춰" 있다. 방울이 「메뉴」 위에 세워져 있고 아무것도 움직이지 않는다.
     움직임은 아이폰에서만 확인되는데 그걸 맥에서 검증할 수 없어서 두 번 빗나갔다.
     그래서 모양부터 눈으로 고르고, 정해진 다음에 움직이게 만든다. */
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  body {
    margin: 0; background: #FCF9F5; color: #2B120D;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }

  .pick { position: sticky; top: 0; z-index: 90; display: flex; gap: 5px; padding: 9px 8px; background: #2B120D; }
  .pick button {
    flex: 1; padding: 10px 2px; border: 0; border-radius: 9px; white-space: nowrap;
    background: #5A4038; color: #FCF9F5; font: 700 12px/1 inherit; font-family: inherit;
  }
  .pick button.on { background: #E0301E; }
  .now { padding: 9px 14px; background: #FFF3D6; border-bottom: 1px solid #E7D9C4; font-size: 13px; font-weight: 700; }

  .stage { padding: 26px 14px 40px; }
  .caption { margin: 0 0 10px; font-size: 12px; font-weight: 700; color: #8A7A70; }
  /* 방울 뒤에 깔리는 것 — 유리가 흐릴 게 있어야 유리로 보인다 */
  .behind { display: flex; gap: 8px; margin-bottom: -30px; }
  .behind i { flex: 1; height: 64px; border-radius: 12px; background: linear-gradient(135deg, #F3E3D4, #E8D3C2); }
  .behind i:nth-child(2) { background: linear-gradient(135deg, #DFE9DA, #CBDCC4); }
  .behind i:nth-child(3) { background: linear-gradient(135deg, #F5D9D2, #EFC2B8); }

  /* ===== 앱의 실제 탭바 값 그대로 ===== */
  .tabbar {
    position: relative; display: flex; justify-content: space-around; gap: 2px;
    width: 100%; max-width: 412px; margin: 0 auto; padding: 5px 10px;
    background: rgba(252, 249, 245, .55);
    border: 1px solid rgba(43, 18, 13, .06);
    border-radius: 28px;
    box-shadow: 0 1px 3px rgba(43, 18, 13, .18), 0 3px 9px rgba(43, 18, 13, .22);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
  }
  .tabbar-btn {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; min-width: 62px; padding: 4px 12px; border: 0; background: none;
    color: #4D4139; font-family: inherit;
  }
  .tabbar-btn.active { color: #E0301E; }
  .tabbar-icon { display: block; width: 22px; height: 22px; }
  .tabbar-label { font-size: 11px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }

  /* ===== 이동 중 방울(유리구슬) — 앱의 --glass 값 그대로 ===== */
  .bubble {
    position: absolute; z-index: 0; width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(140% 140% at 30% 18%,
      rgba(255,255,255,.58) 0%, rgba(255,244,242,.12) 38%,
      rgba(245,217,210,.10) 60%, rgba(224,48,30,.12) 100%);
    border: 1px solid rgba(255,255,255,.60);
    box-shadow:
      -2px 0 5px rgba(224,48,30,.30), 2px 0 5px rgba(224,48,30,.30),
      0 6px 16px rgba(43,18,13,.22),
      inset 0 1.5px 2px rgba(255,255,255,1), inset 0 -2px 3px rgba(255,255,255,.55),
      inset 5px 9px 12px -6px rgba(255,255,255,.55),
      inset -6px -10px 16px -8px rgba(120,70,50,.20);
    -webkit-backdrop-filter: blur(1.5px) saturate(1.5) brightness(1.12);
    backdrop-filter: blur(1.5px) saturate(1.5) brightness(1.12);
  }
  .bubble::before {          /* 표면 반사광 블롭 */
    content: ''; position: absolute; left: 16%; top: 9%; width: 40%; height: 26%;
    border-radius: 50%; background: linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,0));
    filter: blur(1px); z-index: 3;
  }

  /* ── 색수차: 좌우 가장자리에 서로 다른 색을 번지게 (원래 있다가 2026-07-21 에 뺐던 것) ── */
  [data-v="1"] .bubble { box-shadow:
      -2px 0 5px rgba(90,160,255,.18), 2px 0 5px rgba(255,150,60,.18),
      0 6px 16px rgba(43,18,13,.22),
      inset 0 1.5px 2px rgba(255,255,255,1), inset 0 -2px 3px rgba(255,255,255,.55),
      inset 5px 9px 12px -6px rgba(255,255,255,.55), inset -6px -10px 16px -8px rgba(120,70,50,.20); }
  [data-v="2"] .bubble { box-shadow:
      -3px 0 7px rgba(90,160,255,.34), 3px 0 7px rgba(255,150,60,.34),
      0 6px 16px rgba(43,18,13,.22),
      inset 0 1.5px 2px rgba(255,255,255,1), inset 0 -2px 3px rgba(255,255,255,.55),
      inset 5px 9px 12px -6px rgba(255,255,255,.55), inset -6px -10px 16px -8px rgba(120,70,50,.20); }
  [data-v="3"] .bubble { box-shadow:
      -4px 0 9px rgba(70,140,255,.52), 4px 0 9px rgba(255,130,40,.52),
      0 6px 16px rgba(43,18,13,.22),
      inset 0 1.5px 2px rgba(255,255,255,1), inset 0 -2px 3px rgba(255,255,255,.55),
      inset 5px 9px 12px -6px rgba(255,255,255,.55), inset -6px -10px 16px -8px rgba(120,70,50,.20); }

  /* ── 렌즈: 방울 안에 탭 아이콘을 한 벌 복사해 넣는 자리 ──
     🔴 웹은 "뒤에 있는 것"을 휘게 하지 못한다. 방울 밑에 있는 게 우리 아이콘뿐이라
        그것만 복사해 넣는 우회로다. 다른 데서는 못 쓴다. */
  .lens { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; z-index: 2; display: none; }
  [data-v="4"] .lens, [data-v="5"] .lens { display: block; }
  .lens-row { position: absolute; display: flex; justify-content: space-around; gap: 2px; padding: 5px 10px; }
  .lens-row .tabbar-btn { color: #4D4139; }
  .lens-row .tabbar-btn.active { color: #E0301E; }
  /* 복사본이 보이도록 원본 아이콘은 방울 밑에서 가려진다 → 방울 배경을 조금 더 불투명하게 */
  [data-v="4"] .bubble, [data-v="5"] .bubble { background: radial-gradient(140% 140% at 30% 18%,
      rgba(255,255,255,.30) 0%, rgba(255,244,242,.06) 45%, rgba(224,48,30,.10) 100%); }
  .strip { position: absolute; top: 0; bottom: 0; overflow: hidden; }
</style>
</head>
<body>

<div class="pick">
  <button data-go="0" class="on">지금</button>
  <button data-go="1">색수차약</button>
  <button data-go="2">색수차중</button>
  <button data-go="3">색수차강</button>
  <button data-go="4">확대만</button>
  <button data-go="5">휘기</button>
</div>
<div class="now" id="now"></div>

<div class="stage">
  <p class="caption">방울이 「메뉴」 위에 멈춰 서 있습니다</p>
  <div class="behind"><i></i><i></i><i></i></div>
  <nav class="tabbar" id="bar">
    <span class="bubble" id="bubble"><span class="lens" id="lens"></span></span>
  </nav>
</div>

<script>
var 아이콘 = [
 ['홈','<svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 10.8 12 3.8l8.8 7"/><path d="M5.6 9.4V20.2h12.8V9.4"/><path d="M9.8 20.2v-5.2h4.4v5.2"/></svg>'],
 ['레시피','<svg class="tabbar-icon" viewBox="0 0 24 24" fill="none"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 18.5v-14z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 17.5A1.5 1.5 0 0 1 6.5 16H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 7.5h6M9 10.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'],
 ['메뉴','<svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(1.08) translate(-12 -12)"><path d="M8 3.5c-1.7 0-3 1.7-3 3.8 0 1.9 1.3 3.3 3 3.3s3-1.4 3-3.3c0-2.1-1.3-3.8-3-3.8ZM8 10.6v9.9"/><path d="M14.5 3.5 13.6 20.5M18 3.5 17.4 20.5"/></g></svg>'],
 ['매장','<svg class="tabbar-icon" viewBox="0 0 24 24" fill="none"><g transform="translate(12 12) scale(1.045) translate(-12 -12)"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.87617 3.75H19.1238L21 8.86683V10.5C21 11.2516 20.7177 11.9465 20.25 12.4667V21H3.75V12.4667C3.28234 11.9465 3 11.2516 3 10.5V8.86683L4.87617 3.75ZM18.1875 13.3929C18.3807 13.3929 18.5688 13.3731 18.75 13.3355V19.5H15V15H9L9 19.5H5.25V13.3355C5.43122 13.3731 5.61926 13.3929 5.8125 13.3929C6.63629 13.3929 7.36559 13.0334 7.875 12.4667C8.38441 13.0334 9.11371 13.3929 9.9375 13.3929C10.7613 13.3929 11.4906 13.0334 12 12.4667C12.5094 13.0334 13.2387 13.3929 14.0625 13.3929C14.8863 13.3929 15.6156 13.0334 16.125 12.4667C16.6344 13.0334 17.3637 13.3929 18.1875 13.3929ZM10.5 19.5H13.5V16.5H10.5L10.5 19.5ZM19.5 9.75V10.5C19.5 11.2965 18.8856 11.8929 18.1875 11.8929C17.4894 11.8929 16.875 11.2965 16.875 10.5V9.75H19.5ZM19.1762 8.25L18.0762 5.25H5.92383L4.82383 8.25H19.1762ZM4.5 9.75V10.5C4.5 11.2965 5.11439 11.8929 5.8125 11.8929C6.51061 11.8929 7.125 11.2965 7.125 10.5V9.75H4.5ZM8.625 9.75V10.5C8.625 11.2965 9.23939 11.8929 9.9375 11.8929C10.6356 11.8929 11.25 11.2965 11.25 10.5V9.75H8.625ZM12.75 9.75V10.5C12.75 11.2965 13.3644 11.8929 14.0625 11.8929C14.7606 11.8929 15.375 11.2965 15.375 10.5V9.75H12.75Z" fill="currentColor"/></g></svg>'],
 ['스티커','<svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(0.90) translate(-12 -12)"><path d="M2 12C2 17.5228 6.47715 22 12 22C12.6477 22 13.2503 21.7004 13.7083 21.2424L21.2424 13.7083C21.7004 13.2503 22 12.6477 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12Z"/><path d="M8.9126 15.9336C9.94668 16.1928 11.0951 16.2391 12.2688 16.0337"/><ellipse cx="14.5094" cy="9.77405" rx="1" ry="1.5" transform="rotate(-15 14.5094 9.77405)" fill="currentColor" stroke="none"/><ellipse cx="8.71402" cy="11.3278" rx="1" ry="1.5" transform="rotate(-15 8.71402 11.3278)" fill="currentColor" stroke="none"/><path d="M12 22C12 19.2071 12 17.8107 12.3928 16.688C13.0964 14.6773 14.6773 13.0964 16.688 12.3928C17.8107 12 19.2071 12 22 12"/></g></svg>']
];
var 활성 = 2;   // 메뉴

function 줄HTML(cls) {
  var h = '';
  for (var i = 0; i < 아이콘.length; i++) {
    h += '<button class="tabbar-btn' + (i === 활성 ? ' active' : '') + '" type="button">' +
         아이콘[i][1] + '<span class="tabbar-label">' + 아이콘[i][0] + '</span></button>';
  }
  return h;
}

var bar = document.getElementById('bar'), bubble = document.getElementById('bubble'), lens = document.getElementById('lens');
bar.insertAdjacentHTML('beforeend', 줄HTML());

/* 방울을 활성 탭 한가운데로 세운다 */
function 세우기() {
  var b = bar.children[1 + 활성];          // 0번은 .bubble
  bubble.style.left = (b.offsetLeft + b.offsetWidth / 2 - 38) + 'px';
  bubble.style.top  = (b.offsetTop + b.offsetHeight / 2 - 38) + 'px';
  렌즈그리기();
}

/* ── 렌즈 안에 아이콘 복사본을 넣는다 ──
   확대만 = 복사본을 그대로 키운다.
   휘기   = 복사본을 세로 띠 여러 장으로 잘라, 가운데는 넓게 가장자리는 좁게 이어 붙인다.
            (돋보기 가운데가 커 보이고 가장자리가 눌려 보이는 것과 같은 원리)
   🔴 필터를 쓰지 않는다. 띠를 옮겨 붙이는 것뿐이라 위험이 낮다. */
var 띠수 = 26, 확대 = 1.32, 휨 = .55;   /* 휨이 작을수록 가운데가 더 부풀어 보인다 */

function 렌즈그리기() {
  var v = document.documentElement.dataset.v;
  if (v !== '4' && v !== '5') { lens.innerHTML = ''; return; }
  var W = bar.clientWidth, H = bar.clientHeight;
  var bx = parseFloat(bubble.style.left), by = parseFloat(bubble.style.top);
  var 안쪽 = '<span class="lens-row" style="width:' + W + 'px;height:' + H + 'px;left:0;top:0">' + 줄HTML() + '</span>';

  if (v === '4') {                                   /* 확대만 */
    lens.innerHTML = '<span style="position:absolute;left:' + (-bx) + 'px;top:' + (-by) +
      'px;width:' + W + 'px;height:' + H + 'px;transform:scale(' + 확대 + ');transform-origin:' +
      (bx + 38) + 'px ' + (by + 38) + 'px">' + 안쪽 + '</span>';
    return;
  }
  /* 휘기 — 띠 단위로 다시 이어 붙인다 */
  var h = '', R = 38;
  for (var i = 0; i < 띠수; i++) {
    var u = (i + .5) / 띠수 * 2 - 1;                  /* 방울 안 가로 위치 −1~1 */
    var s = u * (휨 + (1 - 휨) * u * u);              /* 그 자리에 보일 "원래" 위치 */
    var k = 1 / (휨 + 3 * (1 - 휨) * u * u);          /* 그 자리의 늘어남 정도 */
    var 띠왼 = (u + 1) / 2 * (R * 2) - (R * 2) / 띠수 / 2;
    var 원래x = bx + R + s * R;                       /* 바 좌표계에서 가져올 위치 */
    h += '<span class="strip" style="left:' + 띠왼 + 'px;width:' + ((R * 2) / 띠수 + .6) + 'px">' +
         '<span style="position:absolute;left:' + (-(원래x) + (R * 2) / 띠수 / 2) + 'px;top:' + (-by) +
         'px;width:' + W + 'px;height:' + H + 'px;transform:scaleX(' + k.toFixed(3) +
         ');transform-origin:' + 원래x + 'px 0">' + 안쪽 + '</span></span>';
  }
  lens.innerHTML = h;
}

var 설명 = [
  '지금 — 앱에 들어 있는 무지개빛 유리구슬. 가장자리 번짐은 빨강 하나뿐입니다',
  '색수차 약 — 왼쪽은 푸르게, 오른쪽은 주황으로 살짝',
  '색수차 중 — 같은 것을 조금 더',
  '색수차 강 — 뚜렷하게. 2026-07-21에 「웜 팔레트와 어긋난다」고 빼셨던 세기에 가깝습니다',
  '확대만 — 방울 안의 아이콘을 키우기만 함. 필터 안 씀, 위험 낮음',
  '휘기 — 가운데는 부풀고 가장자리는 눌림. 띠를 옮겨 붙이는 방식이라 필터를 안 씁니다'
];

function 고르기(v) {
  document.documentElement.dataset.v = v;
  document.getElementById('now').textContent = 설명[v];
  var bs = document.querySelectorAll('.pick button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.go === v);
  렌즈그리기();
}
document.querySelector('.pick').addEventListener('click', function (e) {
  if (e.target.dataset.go) 고르기(e.target.dataset.go);
});
window.addEventListener('resize', 세우기);
세우기();
고르기('0');
</script>
</body>
</html>
