<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>감자 옆 점선 — 번호로 고르기</title>
  <link rel="stylesheet" href="styles.css?v=749">
  <style>
    /* 2차 판(2026-08-05 밤). 1차에서 「감자를 벽 뒤로 넣으면 선이 뭉개진다」까지는 가렸다.
       지금 남은 것은 **선의 굵기와 감자와의 틈**이다.
       🔴 앱과 같은 클래스를 그대로 쓴다 — 목업에서만 다르게 그리면 잰 것이 앱과 안 맞는다.
       🔴 점선 두께 2.5px 은 기록 시트와 함께 쓰는 값이다. 여기서 바꾸는 것은 **빈 화면 상자만**이다. */
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg-card); }
    .wrap { width: min(100%, 440px); margin: 0 auto; padding: 12px 18px 190px; }
    .lead { font-size: 13px; line-height: 1.65; color: var(--text-muted); margin: 0 0 2px; }
    .lead b { color: var(--brand-red); }

    .stamp-empty { min-height: 0; padding: 6px 0 0; }
    .stamp-empty .stamp-empty-slot { width: 220px; }
    .stamp-empty-gamja {
      position: absolute; bottom: 14px; width: 90%; height: auto; display: block;
      pointer-events: none; user-select: none;
    }

    /* 번호마다 ① 점선 두께 ② 감자와 점선 사이 틈, 둘만 달라진다 */
    body[data-v="1"] .stamp-slot-empty { border-width: 2.5px; }
    body[data-v="1"] .stamp-empty-gamja { left: 2px; }     /* 지금 앱 */
    body[data-v="2"] .stamp-slot-empty { border-width: 2.5px; }
    body[data-v="2"] .stamp-empty-gamja { left: 0; }       /* 틈 없음 (얇아 보이던 것) */
    body[data-v="3"] .stamp-slot-empty { border-width: 3px; }
    body[data-v="3"] .stamp-empty-gamja { left: 0; }       /* 틈 없음 + 선을 3px 로 */
    body[data-v="4"] .stamp-slot-empty { border-width: 2.5px; }
    body[data-v="4"] .stamp-empty-gamja { left: 1px; }     /* 틈 1px */
    body[data-v="5"] .stamp-slot-empty { border-width: 2.5px; }
    body[data-v="5"] .stamp-empty-gamja { left: 4px; }     /* 틈 4px */
    body[data-v="6"] .stamp-slot-empty { border-width: 2.5px; }
    body[data-v="6"] .stamp-empty-gamja { display: none; } /* 감자 없음 — 맨 점선 */

    .panel {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(100%, 440px); background: #2B2521; color: #F4EFE8;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom)); z-index: 50; font-size: 13px;
    }
    .panel .row { display: flex; gap: 6px; }
    .panel button {
      flex: 1 1 0; min-width: 0; border: 1px solid #4A4139; background: #3A322C; color: #F4EFE8;
      border-radius: 8px; padding: 9px 0; font: inherit; font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .panel button.on { background: var(--brand-red); border-color: var(--brand-red); }
    .readout { color: #B9AFA4; font-size: 12px; text-align: center; padding-top: 7px; margin: 0; line-height: 1.5; }
  </style>
</head>
<body data-v="1">
  <div class="wrap">
    <p class="lead"><b>감자 왼쪽의 세로 점선</b>만 보세요. 다른 세 변과 <b>같아 보이는 번호</b>를 알려주시면 됩니다.<br>
      6번엔 감자가 없습니다 — 그게 「원래 선」입니다. 마음에 드는 게 없으면 그렇게 말씀해 주세요.</p>

    <div class="stamp-empty">
      <div class="stamp-slot stamp-empty-slot">
        <div class="stamp-slot-empty">
          <!-- 🔴 `is-on` 이 있어야 보인다. 앱은 여섯 장을 겹쳐 놓고 켜진 한 장만 이 클래스를 갖는데,
               styles.css 를 그대로 쓰는 이 판에서 빼먹으면 **감자가 통째로 안 보인다**(실제로 그랬다). -->
          <img class="stamp-empty-gamja is-on" src="assets/mascot/gamja-bubble-busan.webp?v=3"
               width="660" height="800" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row" id="btns"></div>
    <p class="readout" id="readout"></p>
  </div>

<script>
(function () {
  var V = [
    { n: 1, t: '지금 앱 — 선 2.5px · 틈 2px' },
    { n: 2, t: '선 2.5px · 틈 없음 (얇아 보이던 것)' },
    { n: 3, t: '선 3px · 틈 없음 — 감자가 벽에 딱 붙는다' },
    { n: 4, t: '선 2.5px · 틈 1px' },
    { n: 5, t: '선 2.5px · 틈 4px' },
    { n: 6, t: '감자 없음 — 이게 원래 선이다' }
  ];
  var btns = document.getElementById('btns');
  var readout = document.getElementById('readout');
  V.forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = v.n; b.dataset.v = v.n; btns.appendChild(b);
  });
  function apply(n) {
    document.body.dataset.v = n;
    btns.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', +b.dataset.v === n); });
    readout.textContent = n + '번 — ' + V.find(function (v) { return v.n === n; }).t;
  }
  btns.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) apply(+b.dataset.v);
  });
  apply(1);
})();
</script>
</body>
</html>
