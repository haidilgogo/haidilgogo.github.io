<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>감자 옆 점선이 흐린 이유 가리기</title>
  <link rel="stylesheet" href="styles.css?v=745">
  <style>
    /* 폰에서만 「감자 몸쪽 점선이 흐리다」가 보인다. 원인 후보를 하나씩만 바꿔 가며 잰다.
       🔴 앱과 같은 클래스(.stamp-empty / .stamp-slot / .stamp-slot-empty)를 그대로 쓴다 —
          목업에서만 다르게 그리면 잰 것이 앱과 안 맞는다. */
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg-card); }
    .wrap { width: min(100%, 440px); margin: 0 auto; padding: 14px 18px 200px; }
    .lead { font-size: 13px; line-height: 1.7; color: var(--text-muted); margin: 0 0 4px; }
    .lead b { color: var(--brand-red); }

    /* 여기가 시험 대상 — 번호마다 이 두 값만 달라진다 */
    .stamp-empty { min-height: 0; padding: 8px 0 0; }
    .stamp-empty .stamp-empty-slot { width: 220px; }
    .stamp-empty-gamja {
      position: absolute; bottom: 14px; width: 90%; height: auto; display: block;
      pointer-events: none; user-select: none;
    }

    /* 1번 = 지금 앱 그대로 */
    body[data-v="1"] .stamp-slot-empty { overflow: hidden; }
    body[data-v="1"] .stamp-empty-gamja { left: -1px; }
    /* 2번 = 자름만 뺀다 */
    body[data-v="2"] .stamp-slot-empty { overflow: visible; }
    body[data-v="2"] .stamp-empty-gamja { left: -1px; }
    /* 3번 = 자름은 두고 감자를 벽 안쪽으로 */
    body[data-v="3"] .stamp-slot-empty { overflow: hidden; }
    body[data-v="3"] .stamp-empty-gamja { left: 0; }
    /* 4번 = 둘 다 뺀다 */
    body[data-v="4"] .stamp-slot-empty { overflow: visible; }
    body[data-v="4"] .stamp-empty-gamja { left: 0; }
    /* 5번 = 감자를 아예 안 그린다 (기준선) */
    body[data-v="5"] .stamp-slot-empty { overflow: visible; }
    body[data-v="5"] .stamp-empty-gamja { display: none; }
    /* 6번 = 자름만 켜고 감자는 없다 — 「자름 자체가 점선을 흐리게 하나」를 가린다 */
    body[data-v="6"] .stamp-slot-empty { overflow: hidden; }
    body[data-v="6"] .stamp-empty-gamja { display: none; }

    .panel {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(100%, 440px); background: #2B2521; color: #F4EFE8;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom)); z-index: 50; font-size: 13px;
    }
    .panel .row { display: flex; gap: 6px; }
    .panel button {
      flex: 1 1 0; min-width: 0; border: 1px solid #4A4139; background: #3A322C; color: #F4EFE8;
      border-radius: 8px; padding: 9px 0; font: inherit; font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .panel button.on { background: var(--brand-red); border-color: var(--brand-red); }
    .readout { color: #B9AFA4; font-size: 12px; text-align: center; padding-top: 7px; margin: 0; line-height: 1.5; }
  </style>
</head>
<body data-v="1">
  <div class="wrap">
    <p class="lead"><b>감자 몸쪽 왼쪽 점선</b>만 보세요. 번호를 바꿔 가며 <b>또렷한 번호</b>를 알려주시면 됩니다.<br>
      5·6번에는 감자가 없습니다 — 그때도 흐리면 감자 탓이 아닙니다.</p>

    <div class="stamp-empty">
      <div class="stamp-slot stamp-empty-slot">
        <div class="stamp-slot-empty">
          <img class="stamp-empty-gamja" src="assets/mascot/gamja-bubble.webp" width="660" height="800" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row" id="btns"></div>
    <p class="readout" id="readout"></p>
  </div>

<script>
(function () {
  var V = [
    { n: 1, t: '지금 앱 그대로 — 자름 있음 · 감자 벽 뒤 1px' },
    { n: 2, t: '자름만 뺐다 — 감자는 그대로 벽 뒤 1px' },
    { n: 3, t: '자름 있음 · 감자를 벽 안쪽으로(0px)' },
    { n: 4, t: '자름 없음 · 감자를 벽 안쪽으로(0px)' },
    { n: 5, t: '감자 없음 · 자름 없음 — 맨 점선(기준선)' },
    { n: 6, t: '감자 없음 · 자름 있음 — 자름만의 영향' }
  ];
  var btns = document.getElementById('btns');
  var readout = document.getElementById('readout');
  V.forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = v.n; b.dataset.v = v.n; btns.appendChild(b);
  });
  function apply(n) {
    document.body.dataset.v = n;
    btns.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', +b.dataset.v === n); });
    readout.textContent = n + '번 — ' + V.find(function (v) { return v.n === n; }).t;
  }
  btns.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) apply(+b.dataset.v);
  });
  apply(1);
})();
</script>
</body>
</html>
